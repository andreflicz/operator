<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Operator">
<link rel="manifest" href="/manifest.json">
<title>Operator</title>
<style>
:root{ --bg:#0d0f14; --panel:#171a22; --panel2:#1f2330; --line:#2a2f3d; --text:#f2f3f7; --dim:#9aa1b2; --accent:#f2a93b; --good:#4cc38a; --bad:#ff6b6b; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; background:var(--bg); color:var(--text); font:16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
body{ padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px); min-height:100vh; display:flex; flex-direction:column; gap:14px; }
h1{ font-size:22px; margin:0; letter-spacing:-.01em; } h1 b{ color:var(--accent); }
.card{ background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:16px; }
.st{ display:flex; align-items:center; gap:12px; } .dot{ width:12px; height:12px; border-radius:50%; background:var(--dim); flex-shrink:0; } .st.on .dot{ background:var(--good); box-shadow:0 0 12px var(--good); }
.st b{ font-size:17px; } .st small{ display:block; color:var(--dim); font-size:13px; margin-top:2px; }
.big{ width:100%; padding:16px; border-radius:14px; border:0; font:600 17px/1 inherit; color:#1a1206; background:var(--accent); }
.big.out{ background:var(--panel2); color:var(--text); border:1px solid var(--line); }
.row{ display:flex; gap:8px; } input, textarea{ flex:1; min-width:0; padding:13px 14px; border-radius:12px; border:1px solid var(--line); background:var(--panel2); color:var(--text); font:16px inherit; }
textarea{ resize:none; min-height:48px; }
.go{ padding:0 18px; border-radius:12px; border:0; background:var(--accent); color:#1a1206; font:600 16px inherit; }
.chat{ display:flex; flex-direction:column; gap:8px; max-height:46vh; overflow:auto; }
.m{ padding:10px 13px; border-radius:14px; max-width:88%; white-space:pre-wrap; } .m.me{ align-self:flex-end; background:var(--panel2); } .m.op{ align-self:flex-start; background:#2a2414; border:1px solid #4a3a16; }
.k{ font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin-bottom:8px; }
.pair{ display:flex; flex-direction:column; gap:12px; text-align:center; margin-top:18vh; } .pair input{ text-align:center; font-size:28px; letter-spacing:.3em; }
.err{ color:var(--bad); font-size:14px; min-height:18px; text-align:center; }
.hidden{ display:none !important; }
</style></head>
<body>
<div id="pair" class="pair hidden">
  <h1>Operator<b>.</b></h1>
  <input id="code" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code">
  <button class="big" id="pairGo">Connect</button>
  <div class="err" id="pairErr"></div>
</div>
<div id="app" class="hidden" style="display:flex;flex-direction:column;gap:14px">
  <h1>Operator<b>.</b></h1>
  <div class="card st" id="st"><span class="dot"></span><div><b id="stT">…</b><small id="stS"></small></div></div>
  <button class="big" id="lock">Lock in</button>
  <div class="card"><div class="k">Op</div><div class="chat" id="chat"></div>
    <div class="row" style="margin-top:10px"><textarea id="say" rows="1" placeholder="Say something to Op"></textarea><button class="go" id="sayGo">Send</button></div></div>
  <div class="card"><div class="k">Add a task</div><div class="row"><input id="task" placeholder="What needs doing"><button class="go" id="taskGo">Add</button></div></div>
  <div class="err" id="err"></div>
</div>
<script>
(function(){
  var code = ''; try{ code = localStorage.getItem('opCode') || ''; }catch(e){}
  var $ = function(id){ return document.getElementById(id); };
  function api(path, body){
    return fetch('/api/'+path, {method:'POST', headers:{'Content-Type':'application/json', 'X-Op-Code':code}, body:JSON.stringify(body || {})})
      .then(function(r){ if(r.status===401) throw new Error('code'); if(!r.ok) throw new Error('Operator didn’t answer'); return r.json(); });
  }
  function show(paired){ $('pair').classList.toggle('hidden', paired); $('app').classList.toggle('hidden', !paired); }
  function err(t){ $('err').textContent = t || ''; }
  function paint(s){
    if(!s) return;
    $('st').classList.toggle('on', !!s.locked);
    $('stT').textContent = s.locked ? 'Locked in · '+s.mins : (s.mode || 'Not locked in');
    $('stS').textContent = s.locked ? (s.task || '') : (s.next ? 'Next: '+s.next : '');
    $('lock').textContent = s.locked ? 'Lock out' : 'Lock in'; $('lock').classList.toggle('out', !!s.locked);
  }
  function refresh(){ return api('state').then(function(j){ show(true); err(''); paint(j.out); }).catch(function(e){ if(e.message==='code'){ show(false); } else err('Can’t reach your Mac. Same Wi-Fi, and Operator open on it?'); }); }
  function bubble(who, t){ var d = document.createElement('div'); d.className = 'm '+who; d.textContent = t; $('chat').appendChild(d); $('chat').scrollTop = 1e9; return d; }
  function speak(t){ try{ var u = new SpeechSynthesisUtterance(t); speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }
  $('pairGo').onclick = function(){
    code = $('code').value.replace(/\D/g, '');
    api('state').then(function(j){ try{ localStorage.setItem('opCode', code); }catch(e){} show(true); paint(j.out); })
      .catch(function(e){ $('pairErr').textContent = e.message==='code' ? 'That’s not the code on your Mac.' : 'Can’t reach your Mac. Same Wi-Fi?'; });
  };
  $('lock').onclick = function(){ var out = $('lock').classList.contains('out'); api(out ? 'lockout' : 'lockin').then(function(j){ paint(j.out); }).catch(function(){ err('That didn’t go through.'); }); };
  function send(){
    var t = $('say').value.trim(); if(!t) return; $('say').value = ''; bubble('me', t);
    var w = bubble('op', '…');
    api('ask', {text:t}).then(function(j){ var r = (j && j.out) || 'Op didn’t answer.'; w.textContent = r; speak(r); refresh(); }).catch(function(){ w.textContent = 'Op didn’t answer.'; });
  }
  $('sayGo').onclick = send;
  $('say').addEventListener('keydown', function(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
  $('taskGo').onclick = function(){ var t = $('task').value.trim(); if(!t) return; api('task', {title:t}).then(function(){ $('task').value = ''; err('Added.'); setTimeout(function(){ err(''); }, 1500); }).catch(function(){ err('That didn’t go through.'); }); };
  $('code').addEventListener('keydown', function(e){ if(e.key==='Enter') $('pairGo').click(); });
  if(code) refresh(); else show(false);
  setInterval(function(){ if(code && !document.hidden) refresh(); }, 15000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden && code) refresh(); });
})();
</script>
</body></html>
