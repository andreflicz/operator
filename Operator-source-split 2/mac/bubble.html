<!doctype html>
<html><head><meta charset="utf-8"><title>Journal</title>
<style>
  :root{ --bg:rgba(22,24,30,.94); --ink:#F2F3F6; --mute:#9AA0AE; --line:rgba(255,255,255,.10); --acc:#7C8CFF; }
  html,body{ margin:0; height:100%; background:transparent; overflow:hidden; font:13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; color:var(--ink); user-select:none; }
  /* the bubble: drag it anywhere, tap it to write */
  #dot{ position:absolute; right:6px; bottom:6px; width:52px; height:52px; border-radius:50%; background:var(--bg); border:1px solid var(--line); box-shadow:0 6px 20px rgba(0,0,0,.35);
    display:flex; align-items:center; justify-content:center; font-size:22px; cursor:pointer; transition:transform .12s; }
  #dot:hover{ transform:scale(1.05); }
  #dot span{ pointer-events:none; width:30px; height:30px; display:flex; align-items:center; justify-content:center; border-radius:50%; }
  #card{ position:absolute; inset:6px; display:none; flex-direction:column; background:var(--bg); border:1px solid var(--line); border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.4); overflow:hidden; }
  body.open #dot{ display:none; } body.open #card{ display:flex; }
  #bar{ display:flex; align-items:center; gap:8px; padding:10px 12px 6px; -webkit-app-region:drag; }
  #bar b{ font-weight:600; flex:1; }
  #bar button{ -webkit-app-region:no-drag; }
  textarea{ flex:1; margin:0 12px; resize:none; border:0; outline:0; background:transparent; color:var(--ink); font:inherit; font-size:14px; user-select:text; }
  textarea::placeholder{ color:var(--mute); }
  #foot{ display:flex; align-items:center; gap:8px; padding:8px 12px 12px; }
  #foot kbd{ color:var(--mute); font:inherit; font-size:11px; flex:1; }
  button{ border:0; border-radius:9px; padding:6px 12px; font:inherit; cursor:pointer; background:rgba(255,255,255,.08); color:var(--ink); }
  button.go{ background:var(--acc); color:#fff; font-weight:600; }
  button:disabled{ opacity:.4; cursor:default; }
  #ok{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-weight:600; background:var(--bg); }
  body.saved #ok{ display:flex; }
  /* a voice memo: tap the mic, talk, tap again to save it (writing is optional) */
  #mic{ width:34px; height:30px; padding:0; font-size:15px; }
  body.rec #mic{ background:#ff4d5e; color:#fff; }
  #rect{ display:none; color:#ff8f9a; font-size:12px; font-variant-numeric:tabular-nums; flex:1; }
  body.rec #rect{ display:block; } body.rec #foot kbd{ display:none; }
</style></head>
<body>
  <div id="dot" title="Journal"><span id="open">&#9998;</span></div>
  <div id="card">
    <div id="bar"><b>Journal</b><button id="min" title="Back to a bubble">&#8211;</button></div>
    <textarea id="t" placeholder="What’s on your mind?"></textarea>
    <div id="foot"><button id="mic" title="Voice memo">&#127908;</button><kbd>&#8984;&#9166; to save</kbd><span id="rect">0:00</span><button id="cancel">Later</button><button class="go" id="save" disabled>Save</button></div>
    <div id="ok">Saved to your journal &#10003;</div>
  </div>
<script>
  const t = document.getElementById('t'), save = document.getElementById('save');
  const DRAFT = 'op-bubble-draft';
  try{ t.value = localStorage.getItem(DRAFT) || ''; }catch(e){}
  const sync = () => { save.disabled = !t.value.trim(); try{ localStorage.setItem(DRAFT, t.value); }catch(e){} };
  sync();
  function open(){ document.body.classList.add('open'); window.bubble.open(true); setTimeout(() => t.focus(), 30); }
  function close(){ document.body.classList.remove('open'); window.bubble.open(false); }
  // a tap opens it; a drag only moves it
  // (moved by hand: anywhere on the dot is a tap, and a drag moves the bubble)
  let down = null;
  const dot = document.getElementById('dot');
  dot.addEventListener('pointerdown', async (e) => {
    if(e.button !== 0) return;
    const d = { x: e.screenX, y: e.screenY, win: null, moved: false }; down = d;
    try{ dot.setPointerCapture(e.pointerId); }catch(err){}
    try{ d.win = await window.bubble.pos(); }catch(err){}
  });
  dot.addEventListener('pointermove', (e) => {
    const d = down; if(!d || !d.win) return;
    const dx = e.screenX - d.x, dy = e.screenY - d.y;
    if(!d.moved && Math.abs(dx) + Math.abs(dy) < 4) return;
    d.moved = true; window.bubble.moveTo(d.win[0] + dx, d.win[1] + dy);
  });
  const lift = (e) => { const d = down; down = null; if(!d) return; if(d.moved) window.bubble.moved(); else open(); };
  dot.addEventListener('pointerup', lift);
  dot.addEventListener('pointercancel', () => { const d = down; down = null; if(d && d.moved) window.bubble.moved(); });
  document.getElementById('min').addEventListener('click', close);
  document.getElementById('cancel').addEventListener('click', close);
  t.addEventListener('input', sync);
  async function go(){
    const v = t.value.trim(); if(!v) return;
    save.disabled = true;
    const ok = await window.bubble.save(v);
    if(ok){ t.value = ''; sync(); document.body.classList.add('saved'); setTimeout(() => { document.body.classList.remove('saved'); close(); }, 900); }
    else { save.disabled = false; save.textContent = 'Try again'; }
  }
  save.addEventListener('click', go);
  document.addEventListener('keydown', (e) => { if(e.key==='Enter' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); go(); } if(e.key==='Escape') close(); });
  window.bubble.onOpen(() => open());
  // ---- voice memo ----
  const mic = document.getElementById('mic'), rect = document.getElementById('rect');
  let rec = null;
  const clock = (s) => { s = Math.floor(s); return Math.floor(s/60) + ':' + ('0' + (s % 60)).slice(-2); };
  async function micToggle(){
    if(rec){ try{ rec.mr.stop(); }catch(e){} return; }
    let stream = null;
    try{ stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }catch(e){ mic.title = 'The mic isn’t available'; return; }
    const mr = new MediaRecorder(stream), parts = [], at = Date.now();
    rec = { mr, at, t: setInterval(() => { rect.textContent = clock((Date.now() - at)/1000); }, 500) };
    document.body.classList.add('rec'); rect.textContent = '0:00';
    mr.ondataavailable = (ev) => { if(ev.data && ev.data.size) parts.push(ev.data); };
    mr.onstop = () => {
      stream.getTracks().forEach((x) => x.stop());
      clearInterval(rec.t); const dur = (Date.now() - at)/1000; rec = null; document.body.classList.remove('rec');
      const blob = new Blob(parts, { type: mr.mimeType || 'audio/webm' });
      if(blob.size < 2000 || blob.size > 24*1024*1024) return;
      const fr = new FileReader();
      fr.onload = async () => {
        const ok = await window.bubble.memo({ b64: String(fr.result).split(',')[1] || '', mime: blob.type, dur: dur, text: t.value.trim() });
        if(ok){ t.value = ''; sync(); document.getElementById('ok').textContent = 'Voice memo saved ✓'; document.body.classList.add('saved'); setTimeout(() => { document.body.classList.remove('saved'); document.getElementById('ok').textContent = 'Saved to your journal ✓'; close(); }, 900); }
      };
      fr.readAsDataURL(blob);
    };
    mr.start(1000);
  }
  mic.addEventListener('click', micToggle);
</script>
</body></html>
