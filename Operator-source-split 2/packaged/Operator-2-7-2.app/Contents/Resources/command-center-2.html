<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0D12; --panel:#14171F; --panel-2:#191D27; --border:#262B38;
    --text:#E7E9EE; --text-dim:#8A90A2; --text-faint:#4E5568;
    --accent:#E8A23D; --accent-dim:rgba(232,162,61,.14);
    --good:#3FBE8E; --good-dim:rgba(63,190,142,.14);
    --danger:#E8636B; --danger-dim:rgba(232,99,107,.14);
    --info:#8fdcff; --info-dim:rgba(143,220,255,.16);
    --shoot:#C58FFF; --shoot-dim:rgba(197,143,255,.16);
    --radius:8px; --radius-sm:6px;
    --font-display:'Space Grotesk', -apple-system, sans-serif;
    --font-body:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  *{scrollbar-width:thin; scrollbar-color: var(--border) var(--bg);}
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:var(--bg); }
  ::-webkit-scrollbar-thumb{ background-color:var(--border); border-radius:20px; border:2px solid var(--bg); background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover{ background-color:var(--text-faint); }
  ::-webkit-scrollbar-corner{ background:var(--bg); }
  body{margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); -webkit-font-smoothing:antialiased;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  textarea:focus-visible, input:focus-visible{ outline:none; }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

  #loading{display:flex; align-items:center; justify-content:center; height:100vh; color:var(--text-dim); font-size:14px;}
  .app{display:flex; min-height:100vh;}
  .sidebar{width:220px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border); padding:22px 12px; display:flex; flex-direction:column; gap:2px; transition:width .22s cubic-bezier(.4,0,.2,1), padding .22s cubic-bezier(.4,0,.2,1); overflow:hidden;}
  .sidebar.collapsed{width:60px; padding:22px 8px;}
  .brand{font-family:var(--font-display); font-weight:700; font-size:17px; color:var(--text); padding:0 10px 20px; display:flex; align-items:center; justify-content:space-between; gap:6px; white-space:nowrap;}
  .brand em{color:var(--accent); font-style:normal;}
  .brand-text{overflow:hidden; transition:opacity .16s ease; opacity:1;}
  .sidebar.collapsed .brand-text{display:none;}
  .sidebar.collapsed .brand{padding-left:0;padding-right:0;justify-content:center;}
  .app-activity-indicator{font-family:var(--font-body); font-size:11px; color:var(--text-faint); padding:0 14px 14px; margin-top:-12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .sidebar.collapsed .app-activity-indicator{display:none !important;}
  .sidebar-toggle{background:transparent; border:none; color:var(--text-dim); cursor:pointer; font-size:15px; padding:6px; border-radius:var(--radius-sm); flex-shrink:0; transition:background .12s,color .12s;}
  .sidebar-toggle:hover{background:var(--panel-2); color:var(--text);}
  .nav-item{display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:var(--radius-sm); color:var(--text-dim); font-size:13.5px; cursor:pointer; border:none; background:transparent; text-align:left; width:100%; font-family:var(--font-body); transition:background .12s, color .12s; white-space:nowrap;}
  .sidebar.collapsed .nav-item{justify-content:center; padding:9px;}
  .nav-item:hover{background:var(--panel-2); color:var(--text);}
  .nav-item.active{background:var(--accent-dim); color:var(--text); font-weight:600;}
  .nav-icon{width:16px; text-align:center; opacity:.85; flex-shrink:0;}
  .nav-label{transition:opacity .14s ease; opacity:1;}
  .sidebar.collapsed .nav-label{display:none;}
  .main{flex:1; padding:48px 36px 70px; overflow-y:auto; max-height:100vh; overflow-x:hidden;}
  .view-header{margin-bottom:28px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;}
  .view-title{font-family:var(--font-display); font-size:22px; font-weight:700; margin:0 0 4px;}
  .view-sub{color:var(--text-dim); font-size:13.5px; margin:0;}
  .grid{display:grid; gap:14px; align-items:start;}
  .grid-5{grid-template-columns:repeat(5,1fr);}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px;}
  .kpi-label{color:var(--text-dim); font-size:12.5px; margin-bottom:6px;}
  .kpi-value{font-family:var(--font-display); font-size:22px; font-weight:600;}
  .kpi-sub{font-size:12px; color:var(--text-faint); margin-top:4px;}
  .section{margin-bottom:26px;}
  .section-title{font-family:var(--font-display); font-size:15px; font-weight:600; margin:0 0 12px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;}
  .btn{font-family:var(--font-display); border:1px solid var(--border); background:var(--panel-2); color:var(--text); padding:8px 14px; border-radius:var(--radius-sm); font-size:13px; cursor:pointer; font-weight:600; transition:border-color .12s, transform .1s, box-shadow .12s; box-shadow:0 1px 2px rgba(0,0,0,.25);}
  .btn:hover{border-color:var(--accent); transform:translateY(-1px); box-shadow:0 4px 10px rgba(0,0,0,.3);}
  .btn:active{transform:translateY(0) scale(.96); box-shadow:0 1px 2px rgba(0,0,0,.2);}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:#1a1305; box-shadow:0 2px 10px rgba(232,162,61,.3);}
  .btn-primary:hover{opacity:.92; border-color:var(--accent); box-shadow:0 5px 18px rgba(232,162,61,.45);}
  .btn-good{background:var(--good); border-color:var(--good); color:#06231a; box-shadow:0 2px 10px rgba(63,190,142,.3);}
  .btn-good:hover{opacity:.92; box-shadow:0 5px 18px rgba(63,190,142,.4);}
  .btn-ghost{background:transparent; border-color:transparent; color:var(--text-dim); box-shadow:none;}
  .btn-ghost:hover{color:var(--text); background:var(--panel-2); border-color:transparent; box-shadow:none; transform:none;}
  .btn-danger{background:var(--danger); border-color:var(--danger); color:#2b0a0c; box-shadow:0 2px 10px rgba(232,99,107,.35);}
  .btn-danger-ghost{background:transparent; border:1px solid var(--border); color:var(--text-faint);}
  .btn-danger-ghost:hover{border-color:var(--danger); color:var(--danger); background:var(--danger-dim);}
  .btn-danger:hover{opacity:.92; box-shadow:0 5px 18px rgba(232,99,107,.5);}
  .btn-sm{padding:5px 10px; font-size:12px;}
  .btn[disabled]{opacity:.35; cursor:default; pointer-events:none;}
  .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .input{background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:var(--radius-sm); padding:8px 10px; font-size:13px; font-family:var(--font-body);}
  .input:focus{outline:none; border-color:var(--accent);}
  .field{display:flex; flex-direction:column; gap:4px;}
  .field label{font-size:11.5px; color:var(--text-faint);}
  .task-list{display:flex; flex-direction:column; gap:8px;}
  .task-item-v2{display:flex; align-items:flex-start; gap:14px; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; flex-wrap:wrap; transition:border-color .15s ease, background .15s ease;}
  .task-item-v2.done{opacity:.5;}
  .task-item-v2.done .task-title{text-decoration:line-through;}
  .task-title-row{display:flex; align-items:center; gap:8px;}
  .task-title{font-size:14px; font-weight:500;}
  .task-notes{font-size:12.5px; color:var(--text-dim); margin-top:4px; line-height:1.45; white-space:pre-wrap;}
  .task-card-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); gap:8px; align-content:start;}
  .task-column{ background:rgba(255,255,255,.015); border:2px dashed var(--border); border-radius:var(--radius); padding:12px; min-height:120px; transition:border-color .15s, background .15s; }
  .task-column.fixed-size{ height:520px; overflow-y:auto; }
  .task-column.drop-hover{ border-color:var(--accent); background:var(--accent-dim); }
  .task-card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:13px 14px; display:flex; flex-direction:column; gap:7px; min-height:112px;}
  .task-card.done{opacity:.55;}
  .task-card.someday-task-card{opacity:.6; border-style:dashed;}
  .task-card-title{font-size:15px; font-weight:700; line-height:1.3;}
  .task-card.done .task-card-title{text-decoration:line-through;}
  .checkbox{width:19px; height:19px; margin-top:2px; border-radius:6px; border:1.5px solid var(--text-faint); flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:11px; transition:transform .1s, background .12s, border-color .12s;}
  @keyframes checkPop{ 0%{ transform:scale(.45); } 55%{ transform:scale(1.35); } 100%{ transform:scale(1); } }
  .checkbox.checked{ animation:checkPop .4s cubic-bezier(.34,1.56,.64,1); box-shadow:0 0 14px rgba(63,190,142,.65); }
  @keyframes taskCompleteFlash{ 0%{ box-shadow:0 0 0 1px rgba(63,190,142,.9), 0 0 22px 2px rgba(63,190,142,.55); background-color:rgba(63,190,142,.16); } 100%{ box-shadow:0 0 0 1px rgba(63,190,142,0), 0 0 0 0 rgba(63,190,142,0); } }
  .just-completed{ animation:taskCompleteFlash .9s ease-out; border-color:var(--good) !important; }
  .select-box{width:16px; height:16px; border-radius:5px; border:1.5px solid var(--text-faint); flex-shrink:0; cursor:pointer; background:var(--bg); transition:background .12s, border-color .12s;}
  .select-box.checked{ background:var(--accent); border-color:var(--accent); }
  .select-box.checked::after{ content:'\2713'; display:block; text-align:center; line-height:14px; font-size:11px; color:#1a1305; font-weight:700; }
  .bulk-toolbar{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; background:var(--panel-2); border:1px solid var(--accent); border-radius:var(--radius); padding:14px 18px; position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:60; box-shadow:0 10px 30px rgba(0,0,0,.4); max-width:calc(100vw - 280px); }
  @media (max-width:900px){ .bulk-toolbar{ max-width:calc(100vw - 32px); } }
  .toolbar-label{ font-weight:700; color:var(--text); padding-right:4px; }
  .toolbar-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .toolbar-cancel{ margin-left:auto; }
  .client-check-list{ display:flex; flex-direction:column; gap:6px; max-height:150px; overflow-y:auto; border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 10px; background:var(--bg); }
  .client-check-row{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-dim); cursor:pointer; }
  .client-check-row input{ cursor:pointer; }
  .modal-note-box{ background:var(--panel-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; margin-top:8px; font-size:13px; color:var(--text-dim); line-height:1.5; }
  .row-selected{ border-color:var(--accent) !important; }
  .card-selected{ border-color:var(--accent) !important; box-shadow:0 0 0 1px var(--accent); }
  .checkbox:active{transform:scale(.85);}
  .checkbox.checked{background:var(--good); border-color:var(--good); color:#06231a;}
  .tag{font-size:11px; padding:3px 9px; border-radius:20px; font-weight:600; flex-shrink:0; display:inline-flex; align-items:center; line-height:1.4;}
  .tag-client{background:var(--info-dim); color:var(--info);}
  .tag-general{background:var(--accent-dim); color:#f3c988;}
  .tag-personal{background:rgba(138,144,162,.18); color:var(--text-dim);}
  .tag-high{background:var(--danger-dim); color:#ffb3b8;}
  .tag-med{background:var(--accent-dim); color:#f3c988;}
  .tag-low{background:rgba(138,144,162,.18); color:var(--text-dim);}
  .tag-good{background:var(--good-dim); color:var(--good);}
  .is-current-task{border-color:var(--good) !important; background:var(--good-dim);}
  .is-pending-task{border-color:var(--accent) !important; background:var(--accent-dim);}
  .ongoing-chip{display:inline-flex; align-items:center; padding:7px 12px; border-radius:20px; background:var(--panel-2); border:1px solid var(--border); font-size:13px; cursor:pointer; transition:border-color .12s;}
  .ongoing-chip:hover{border-color:var(--accent);}
  .video-idea-card{ background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.35) !important; border-left:3px solid #fff !important; }
  .settings-shell{display:flex; gap:24px; align-items:flex-start;}
  .settings-sidenav{width:190px; flex-shrink:0; display:flex; flex-direction:column; gap:2px; position:sticky; top:0;}
  .settings-nav-item{display:flex; align-items:center; padding:10px 12px; border-radius:var(--radius-sm); color:var(--text-dim); font-size:13.5px; cursor:pointer; border:none; background:transparent; text-align:left; width:100%; font-family:var(--font-body); transition:background .12s, color .12s;}
  .settings-nav-item:hover{background:var(--panel-2); color:var(--text);}
  .settings-nav-item.active{background:var(--accent-dim); color:var(--text); font-weight:600;}
  .settings-content{flex:1; min-width:0;}
  @media (max-width:720px){
    .settings-shell{flex-direction:column;}
    .settings-sidenav{width:100%; flex-direction:row; overflow-x:auto; position:static;}
  }
  .tag-danger{background:var(--danger-dim); color:#ffb3b8;}
  .tag-warn{background:rgba(232,162,61,.18); color:#f3c988;}
  .tag-ongoing{background:rgba(143,220,255,.16); color:#8fdcff;}
  .ongoing-task-card{border-left:3px solid #8fdcff;}
  .ongoing-days-pill{font-size:11px; padding:3px 9px; border-radius:20px; background:rgba(143,220,255,.14); color:#8fdcff; font-weight:600; white-space:nowrap; display:inline-block;}
  .mini-cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .mini-cal-title{font-weight:700; font-size:15px;}
  .mini-cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center;}
  .mini-cal-dow{font-size:11px; color:var(--text-dim); padding:4px 0; font-weight:600;}
  .mini-cal-day{padding:8px 0; border-radius:8px; cursor:pointer; font-size:13px; background:transparent; border:1px solid transparent; color:var(--text);}
  .mini-cal-day:hover{background:var(--panel-2); border-color:var(--border);}
  .mini-cal-day.mini-cal-today{border-color:var(--accent); color:var(--accent);}
  .mini-cal-day.mini-cal-selected{background:var(--accent); color:#1a1200; font-weight:700;}
  .mini-cal-day.mini-cal-empty{cursor:default; visibility:hidden;}
  .mini-cal-nav{background:transparent; border:1px solid var(--border); color:var(--text); border-radius:8px; width:30px; height:30px; cursor:pointer; font-size:14px;}
  .mini-cal-nav:hover{background:var(--panel-2);}
  .client-card-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(320px,1fr)); gap:18px; align-content:start;}
  .client-card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:28px; display:flex; flex-direction:column; gap:16px; min-height:220px;}
  .client-card:hover{border-color:var(--accent-dim);}
  .client-ops-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:16px; align-content:start;}
  .client-health-card{display:flex; flex-direction:column; gap:10px; border-left-width:3px; transition:transform .12s, box-shadow .12s;}
  .client-health-card:hover{transform:translateY(-1px); box-shadow:0 6px 20px rgba(0,0,0,.28);}
  .client-health-delivs{display:flex; flex-direction:column; gap:6px; margin-top:2px;}
  .client-touch-row{margin-top:auto; padding-top:6px;}
  .client-touch-btn{font-variant-numeric:tabular-nums; min-width:40px; height:26px; padding:0 8px; border-radius:14px; border:1px solid transparent; background:transparent; color:var(--text-faint); font-size:12.5px; display:inline-flex; align-items:center; justify-content:center; gap:5px; cursor:pointer; transition:border-color .12s,color .12s,background .12s;}
  .client-touch-btn:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-dim);}
  .toast-container{position:fixed; top:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px; pointer-events:none;}
  .toast{background:var(--panel-2); border:1px solid var(--border); border-radius:12px; padding:10px 14px; box-shadow:0 10px 28px rgba(0,0,0,.35); font-size:12.5px; color:var(--text-dim); display:flex; align-items:center; gap:10px; max-width:280px; pointer-events:auto; opacity:0; transform:translateY(-8px); transition:opacity .18s ease, transform .18s ease;}
  .toast.show{opacity:1; transform:translateY(0);}
  .toast-icon{flex-shrink:0; font-size:14px;}
  .toast-action{margin-left:auto; flex-shrink:0; font-size:12px; color:var(--accent); cursor:pointer; font-weight:600; white-space:nowrap;}
  .toast-action:hover{text-decoration:underline;}
  @keyframes stagedPulse{ 0%{ box-shadow:0 0 0 0 rgba(232,162,61,.55); } 70%{ box-shadow:0 0 0 18px rgba(232,162,61,0); } 100%{ box-shadow:0 0 0 0 rgba(232,162,61,0); } }
  .staged-task-card{ border-color:var(--accent) !important; }
  .staged-task-card.just-staged{ animation:stagedPulse 1s ease-out; }
  .cal-big-clock{ font-family:var(--font-display); font-size:56px; font-weight:700; letter-spacing:.02em; line-height:1.1; font-variant-numeric:tabular-nums; }
  .mini-cal-strip{ display:flex; gap:6px; margin-top:10px; cursor:pointer; padding:8px 10px; border-radius:var(--radius); transition:background .15s; }
  .mini-cal-strip:hover{ background:var(--panel-2); }
  .mini-cal-cell{ display:flex; flex-direction:column; align-items:center; gap:3px; width:30px; }
  .mini-cal-dow{ font-size:9.5px; color:var(--text-faint); text-transform:uppercase; }
  .mini-cal-num{ font-size:13px; font-weight:600; color:var(--text-dim); width:24px; height:24px; display:flex; align-items:center; justify-content:center; border-radius:50%; }
  .mini-cal-cell.is-today .mini-cal-num{ background:var(--accent); color:#1a1206; }
  .mini-cal-dot{ width:5px; height:5px; border-radius:50%; }
  .deliv-counter{ display:flex; align-items:center; gap:12px; padding:6px 0; }
  .deliv-counter-ring{ width:42px; height:42px; border-radius:50%; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:15px; flex-shrink:0; transition:border-color .2s, color .2s; }
  .deliv-counter-info{ flex:1; min-width:0; }
  .deliv-counter-title{ font-size:13px; font-weight:600; }
  .deliv-counter-actions{ display:flex; align-items:center; gap:4px; flex-shrink:0; }
  .deliv-counter-undo{ font-size:15px; line-height:1; color:var(--text-faint); cursor:pointer; background:none; border:none; padding:4px 6px; }
  .deliv-counter-undo:hover{ color:var(--text-dim); }
  .deliv-counter-undo:disabled{ opacity:.35; cursor:default; }
  .deliv-step-btn{ width:24px; height:24px; border-radius:50%; border:1px solid transparent; background:transparent; color:var(--text-faint); font-size:13px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:border-color .12s,color .12s,background .12s; }
  .deliv-step-btn:hover{ border-color:var(--accent); color:var(--accent); background:var(--accent-dim); }
  .deliv-step-btn:disabled{ opacity:.35; cursor:default; }
  .quick-access-dock{ position:fixed; top:104px; right:26px; display:flex; flex-direction:column; align-items:flex-end; gap:10px; z-index:40; }
  .quick-access-toggle{ width:38px; height:38px; border-radius:50%; border:1px solid var(--border); background:var(--panel-2); color:var(--text-dim); font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:border-color .12s, color .12s; flex-shrink:0; }
  .quick-access-toggle:hover{ border-color:var(--accent); color:var(--accent); }
  .quick-access-items{ display:flex; flex-direction:column; gap:8px; background:var(--panel); border:1px solid var(--border); border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.35); max-width:0; opacity:0; padding:0; overflow:hidden; transition:max-width .2s ease, opacity .15s ease, padding .2s ease; }
  .quick-access-dock.open .quick-access-items{ max-width:220px; opacity:1; padding:10px; }
  .quick-link-item{ display:flex; flex-direction:row; align-items:center; gap:10px; text-decoration:none; color:var(--text-dim); font-size:12.5px; -webkit-user-drag:none; user-select:none; position:relative; white-space:nowrap; padding:4px 4px; border-radius:8px; transition:background .12s; }
  .quick-link-item:hover{ background:var(--panel-2); }
  .quick-link-item:hover .quick-link-circle{ transform:scale(1.06); border-color:var(--accent); }
  .quick-link-circle{ width:30px; height:30px; border-radius:50%; overflow:hidden; display:flex; align-items:center; justify-content:center; border:1px solid var(--border); background:var(--panel-2); transition:transform .12s, border-color .12s; flex-shrink:0; }
  .quick-link-circle img{ width:100%; height:100%; object-fit:cover; }

<script>
(function(){

// ============ STORAGE ============
const hasCloud = !!(window.storage && typeof window.storage.get === 'function');
async function storageGetRaw(key){
  if(hasCloud){ try{ const r = await window.storage.get(key, false); return r ? r.value : null; }catch(e){ return null; } }
  try{ return localStorage.getItem('opsdash:'+key); }catch(e){ return null; }
}
async function storageSetRaw(key, val){
  if(hasCloud){ try{ await window.storage.set(key, val, false); return true; }catch(e){ return false; } }
  try{ localStorage.setItem('opsdash:'+key, val); return true; }catch(e){ return false; }
}
async function loadKey(key, fallback){
  const raw = await storageGetRaw(key);
  if(!raw) return fallback;
  try{ const p = JSON.parse(raw); return p==null ? fallback : p; }catch(e){ return fallback; }
}
let persistWarnedAt = 0;
async function persist(key){
  const ok = await storageSetRaw(key, JSON.stringify(state[key]));
  // A failed write used to be silent — the change looked saved but vanished on reload.
  if(!ok && Date.now()-persistWarnedAt > 15000 && typeof showToast==='function'){
    persistWarnedAt = Date.now();
    showToast("Couldn't save — browser storage is full. Export your data from Settings.", {icon:'&#9888;', duration:6000});
  }
  return ok;
}
const STATE_KEYS = ['profile','tasks','focus','health','meals','journal','finances','business','calendar','standards','daysOff','goals','dashboardPanels','modes','settings','appActivity','personal','boards'];
// The native Operator wrapper script (if running as the packaged .app) polls the
// frontmost macOS app in the background and serves recent samples over a local,
// loopback-only HTTP endpoint. When running as a plain file in a regular browser
// (no wrapper), this endpoint simply won't respond and the feature no-ops.
const APP_ACTIVITY_PORT = 8934;
const APP_ACTIVITY_URL = 'http://127.0.0.1:'+APP_ACTIVITY_PORT+'/';

// ============ HELPERS ============
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function pad2(n){ return String(n).padStart(2,'0'); }
function ordinal(n){
  n = Number(n)||1;
  const s = ['th','st','nd','rd'], v = n%100;
  return n+(s[(v-20)%10]||s[v]||s[0]);
}
function todayStr(d){ d=d||new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function nowHM(d){ d=d||new Date(); return pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function fmtDateShort(s){
  if(!s) return '—';
  const parts = s.split('-').map(Number);
  const dt = new Date(parts[0], parts[1]-1, parts[2]);
  return dt.toLocaleDateString(undefined,{month:'short', day:'numeric'});
}
function weekdayShort(dateStr){
  const parts = dateStr.split('-').map(Number);
  const dt = new Date(parts[0], parts[1]-1, parts[2]);
  return dt.toLocaleDateString(undefined,{weekday:'short'});
}
function addDays(dateStr, n){
  const parts = dateStr.split('-').map(Number);
  const dt = new Date(parts[0], parts[1]-1, parts[2]);
  dt.setDate(dt.getDate()+n);
  return todayStr(dt);
}
function monthKeyOf(dateStr){ return dateStr ? dateStr.slice(0,7) : ''; }
function startOfWeekStr(dateStr){
  const parts = (dateStr||todayStr()).split('-').map(Number);
  const dt = new Date(parts[0], parts[1]-1, parts[2]);
  const day = dt.getDay();
  const diff = (day===0) ? -6 : (1-day);
  dt.setDate(dt.getDate()+diff);
  return todayStr(dt);
}
// Sunday-based week start (local time) — used for "time worked this week", which resets
// every Sunday at 12 AM. Business deliverable weeks keep their Monday start.
function startOfWeekSundayStr(dateStr){
  const parts = (dateStr||todayStr()).split('-').map(Number);
  const dt = new Date(parts[0], parts[1]-1, parts[2]);
  dt.setDate(dt.getDate()-dt.getDay());
  return todayStr(dt);
}
function thisWeekKey(){ return startOfWeekStr(todayStr()); }
function endOfWeekStr(dateStr){ return addDays(startOfWeekStr(dateStr), 6); }
function thisMonthKey(){ return monthKeyOf(todayStr()); }
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
function arr(v){ return Array.isArray(v) ? v : []; }
function fmtDurationLabel(mins){
  mins = Number(mins)||0;
  const h = Math.floor(mins/60), m = mins%60;
  if(h===0) return m+'m';
  if(m===0) return h+'h';
  return h+'h '+m+'m';
}
function durationOptions(maxMinutes){
  maxMinutes = maxMinutes || 240;
  const opts = [];
  for(let m=15; m<=maxMinutes; m+=15) opts.push({value:m, label:fmtDurationLabel(m)});
  return opts;
}
function hexToRgba(hex, alpha){
  hex = String(hex||'#E8A23D').replace('#','');
  if(hex.length===3) hex = hex.split('').map(function(c){return c+c;}).join('');
  const r=parseInt(hex.substring(0,2),16), g=parseInt(hex.substring(2,4),16), b=parseInt(hex.substring(4,6),16);
  return 'rgba('+r+','+g+','+b+','+alpha+')';
}
function goalAccentColor(){ return (state.profile && state.profile.goalAccentColor) || '#3FBE8E'; }
function goalColor(){ return goalAccentColor(); }
function goalGlowStyle(pct){
  const intensity = clamp(pct,0,150)/150;
  const blur = Math.round(4 + intensity*22);
  const alpha = (0.15 + intensity*0.5).toFixed(2);
  return 'box-shadow:0 0 '+blur+'px '+hexToRgba(goalAccentColor(), alpha)+';';
}
function goalGlowFilter(pct){
  const intensity = clamp(pct,0,150)/150;
  const blur = Math.round(3 + intensity*14);
  const alpha = (0.25 + intensity*0.55).toFixed(2);
  return 'filter:drop-shadow(0 0 '+blur+'px '+hexToRgba(goalAccentColor(), alpha)+');';
}
function applyTheme(){
  try{
    const color = state.profile.accentColor || '#E8A23D';
    document.documentElement.style.setProperty('--accent', color);

}

  const nav = document.getElementById('sidebarNav');
  if(!nav) return;
  nav.classList.toggle('collapsed', !!state.profile.sidebarCollapsed);
  setTimeout(function(){ if(typeof stretchLockedHeaderLine==='function') stretchLockedHeaderLine(); }, 230);

const DAY_LETTERS = ['S','M','T','W','T','F','S'];

const STAGE_LABELS = {lead:'Lead', contacted:'Contacted', discovery:'Discovery Call', proposal:'Proposal', closed:'Closed', lost:'Lost'};
const STAGE_ORDER = ['lead','contacted','discovery','proposal','closed'];

  {id:'personalStats', label:'Streak & Personal Stats (includes Standard)'},
  {id:'business', label:'Business Snapshot'},
  {id:'clientOps', label:'Client Health (deliverable pace & touches)'},
  {id:'goals', label:'Goals'},
  {id:'journal', label:'Journal'},
  {id:'focusMini', label:'Focus'},
  {id:'calendarMini', label:'Calendar'},
  {id:'tasks', label:"Today's Tasks"},
  {id:'reachOut', label:'Reach Out Today (leads & clients due a touch)'}

const SMALL_PANELS = ['focusMini', 'calendarMini']; // journal is full-width now that it sits near the top
const MOODS = [
  {id:'idea', emoji:'\uD83D\uDCA1', label:'Idea', color:'#8fdcff'},
  {id:'win', emoji:'\uD83C\uDF89', label:'Win', color:'#3FBE8E'},
  {id:'vent', emoji:'\uD83D\uDE24', label:'Vent', color:'#E8636B'},
  {id:'reflect', emoji:'\uD83E\uDD14', label:'Reflect', color:'#b39ddb'},
  {id:'tired', emoji:'\uD83D\uDE34', label:'Tired', color:'#8A90A2'}
];
function journalTypes(){ return (state.journal && Array.isArray(state.journal.types) && state.journal.types.length) ? state.journal.types : defaultJournalTypes(); }
function moodById(id){ return journalTypes().find(function(m){ return m.id===id; }) || MOODS.find(function(m){ return m.id===id; }); }
const RESET_TARGETS = [
  {id:'focusSessions', label:'Focus sessions (all-time deep work history)'},
  {id:'tasks', label:'Tasks (today, backlog & finished)'},
  {id:'journal', label:'Journal entries'},
  {id:'goals', label:'Goals'},
  {id:'health', label:'Health logs (workouts, weight, calories)'},
  {id:'finances', label:'Finances (debts & income)'},
  {id:'business', label:'Business (clients & pipeline)'},
  {id:'calendarEvents', label:'Calendar events'},
  {id:'standardsHistory', label:'Standard completions (streak history)'},
  {id:'daysOff', label:'Days off history'},
  {id:'appActivity', label:'App activity history (most-used apps)'},
  {id:'wishlist', label:'Wish list'},
  {id:'boards', label:'Vision & journal boards'}
];


// ============ DOM MORPH (in-place re-render) ============
// Every action re-renders by building an HTML string. Swapping that string in with
// innerHTML throws away the whole subtree: entry animations replay from opacity 0 (the
// app-wide black flash), images re-decode, inner scroll positions jump to the top, and
// half-typed form fields reset. morphInto() instead patches the live DOM to match the new
// markup, so only the nodes whose content actually changed are touched.
//
// Matching: children are paired by key (id, data-key, data-task-id, or data-action+data-id)
// and otherwise by position + tag name. Form fields:
//  - default mode (views): the live value is synced to the new markup, except for the
//    field that currently has focus, so typing is never clobbered by a background re-render.
//  - opts.form (modals): a field the user has edited keeps their value as long as the
//    markup's own default for it didn't change — re-rendering a modal (e.g. toggling a
//    chip) no longer wipes edits made to other fields.
// data-selected is skipped because scroll pickers keep their live selection there.
const MORPH_SKIP_ATTRS = { 'data-selected': true };
function morphKey(node){
  if(node.nodeType!==1) return null;
  if(node.id) return '#'+node.id;

function fieldSnapshot(el){

  if(!snap) return;

  if(isCheck){
    const newChecked = newN ? newN.hasAttribute('checked') : snap.def;
    const dirty = snap.checked!==snap.def;
    const keep = focused || (opts.form && dirty && newChecked===snap.def);
    el.checked = keep ? snap.checked : newChecked;
    return;
  }
  const want = newDefault==null ? '' : newDefault;
  const dirty = snap.value!==(snap.def==null ? '' : snap.def);
  const keep = focused || (opts.form && dirty && (newDefault==null ? '' : newDefault)===(snap.def==null ? '' : snap.def));

// Modal content cards are cleared when their overlay closes, so reopening a modal for a
// different item always starts from a clean render instead of morphing stale fields.
// Overlays also get a short fade-in — skipped when one modal hands off directly to
// another, so chained dialogs don't flicker.
(function watchOverlays(){
  let lastHiddenAt = 0;
  function setup(){
    if(!window.MutationObserver) return;
    const obs = new MutationObserver(function(muts){
      muts.forEach(function(m){
        const o = m.target;
        const nowHidden = o.classList.contains('hidden');
        const wasHidden = String(m.oldValue||'').split(/\s+/).indexOf('hidden')>=0;
        if(nowHidden && !wasHidden){
          lastHiddenAt = performance.now();
          const card = o.querySelector(':scope > [id$="Content"]');
          if(card && o.id!=='alarmOverlay') card.innerHTML = '';
        } else if(!nowHidden && wasHidden){
          const chained = performance.now()-lastHiddenAt < 150;
          o.classList.toggle('overlay-instant', chained);
        }
      });
    });
    document.querySelectorAll('.overlay').forEach(function(o){
      obs.observe(o, {attributes:true, attributeFilter:['class'], attributeOldValue:true});
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', setup); else setup();
})();

// ============ BLOB STORE (images + files) ============
// localStorage holds ~5 MB total, which a handful of screenshots would fill (and a failed
// save silently loses data). Binary content — journal photos, client/lead files, vision
// board images, wish list images — goes into IndexedDB instead, and the JSON state only
// keeps a small reference string "idb:<id>". Older inline data: URLs keep working as-is.
// If IndexedDB isn't available the content falls back to an inline data: URL.
const BLOB_DB_NAME = 'operator-blobs';
const BLANK_IMG = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
let blobDbPromise = null;
const blobUrlCache = {};
const blobLoading = {};
function blobDb(){
  if(!blobDbPromise){
    blobDbPromise = new Promise(function(resolve, reject){
      try{
        if(!window.indexedDB) return reject(new Error('no indexedDB'));
        const req = indexedDB.open(BLOB_DB_NAME, 1);
        req.onupgradeneeded = function(){ req.result.createObjectStore('blobs'); };
        req.onsuccess = function(){ resolve(req.result); };
        req.onerror = function(){ reject(req.error); };
      }catch(e){ reject(e); }
    });
  }
  return blobDbPromise;
}
function blobTx(mode, fn){
  return blobDb().then(function(db){
    return new Promise(function(resolve, reject){
      const tx = db.transaction('blobs', mode);
      const store = tx.objectStore('blobs');
      const req = fn(store);
      tx.oncomplete = function(){ resolve(req ? req.result : undefined); };
      tx.onerror = function(){ reject(tx.error); };
      tx.onabort = function(){ reject(tx.error); };
    });
  });
}
function isBlobRef(ref){ return typeof ref==='string' && ref.indexOf('idb:')===0; }

async function prepareImageBlob(file){

  if(file.size <= 6*1024*1024 || file.type==='image/gif' || file.type==='image/svg+xml') return file;

    const img = await new Promise(function(res, rej){ const i = new Image(); i.onload=function(){ res(i); }; i.onerror=rej; i.src=url; });

    c.width = Math.round(img.naturalWidth*scale); c.height = Math.round(img.naturalHeight*scale);

function buildScrollPicker(id, options, selectedValue){
  const items = options.map(function(o){ return '<div class="picker-item" data-value="'+o.value+'">'+o.label+'</div>'; }).join('');
  return '<div class="picker-frame"><div class="scroll-picker" id="'+id+'" data-selected="'+selectedValue+'">'+
    '<div class="picker-spacer"></div>'+items+'<div class="picker-spacer"></div>'+
  '</div></div>';
}
function initScrollPicker(id, defaultValue){
  const el = document.getElementById(id);
  if(!el) return;
  function updateCenter(){
    const rect = el.getBoundingClientRect();
    const centerY = rect.top + rect.height/2;
    let closest = null, closestDist = Infinity;
    el.querySelectorAll('.picker-item').forEach(function(item){
      const r = item.getBoundingClientRect();
      const itemCenter = r.top + r.height/2;
      const dist = Math.abs(itemCenter-centerY);
      if(dist<closestDist){ closestDist=dist; closest=item; }
    });
    el.querySelectorAll('.picker-item').forEach(function(item){ item.classList.remove('picker-center'); });
    if(closest){ closest.classList.add('picker-center'); el.dataset.selected = closest.dataset.value; }
  }
  // Re-renders morph the picker in place, so only wire the scroll listener once per element.
  if(!el._pickerWired){
    el._pickerWired = true;
    let t;
    el.addEventListener('scroll', function(){ clearTimeout(t); t=setTimeout(updateCenter, 90); });
  }
  const target = el.querySelector('.picker-item[data-value="'+defaultValue+'"]');
  if(target){ try{ el.scrollTop = target.offsetTop - el.clientHeight/2 + target.offsetHeight/2; }catch(e){} }
  updateCenter();
}

  const el = document.getElementById(id);

function soundOn(){ return state.profile.soundEnabled !== false; }
let sharedAudioCtx = null;
function getAudioCtx(){
  try{
    const Ctx = window.AudioContext||window.webkitAudioContext;
    if(!sharedAudioCtx || sharedAudioCtx.state==='closed'){ sharedAudioCtx = new Ctx(); }
    if(sharedAudioCtx.state==='suspended'){ sharedAudioCtx.resume().catch(function(){}); }
    return sharedAudioCtx;
  }catch(e){ return null; }
}
function tone(freqs, dur, gainPeak){
  if(!soundOn()) return;
  try{
    const ctx = getAudioCtx();
    if(!ctx) return;
    let t = ctx.currentTime;
    freqs.forEach(function(freq){
      const osc=ctx.createOscillator(), gain=ctx.createGain();
      osc.type='sine'; osc.frequency.value=freq;
      gain.gain.setValueAtTime(0.0001,t);
      gain.gain.exponentialRampToValueAtTime(gainPeak||0.25,t+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t); osc.stop(t+dur+0.02);
      t+=dur*0.75;
    });
  }catch(e){}
}

  const parts = hm.split(':').map(Number);
  let h = parts[0], m = parts[1];
  const ampm = h>=12 ? 'PM' : 'AM';
  h = h % 12; if(h===0) h = 12;

function playAlarmSound(style){
  style = style || (state.profile && state.profile.alarmSound) || 'standard';
  try{
    const ctx = getAudioCtx();
    if(!ctx) return;
    let t = ctx.currentTime;
    if(style==='peaceful'){
      [523,659,784].forEach(function(freq){
        const osc=ctx.createOscillator(), gain=ctx.createGain();
        osc.type='sine'; osc.frequency.value=freq;
        gain.gain.setValueAtTime(0.0001,t);
        gain.gain.exponentialRampToValueAtTime(0.18,t+0.08);
        gain.gain.exponentialRampToValueAtTime(0.0001,t+0.9);
        osc.connect(gain).connect(ctx.destination);
        osc.start(t); osc.stop(t+0.95);
        t += 0.4;
      });
    } else if(style==='loud'){
      for(let i=0;i<6;i++){
        [988,784].forEach(function(freq, idx){
          const osc=ctx.createOscillator(), gain=ctx.createGain();
          osc.type='square'; osc.frequency.value=freq;
          gain.gain.setValueAtTime(0.0001, t+idx*0.09);
          gain.gain.exponentialRampToValueAtTime(0.4, t+idx*0.09+0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, t+idx*0.09+0.11);
          osc.connect(gain).connect(ctx.destination);
          osc.start(t+idx*0.09); osc.stop(t+idx*0.09+0.13);
        });
        t += 0.2;
      }
    } else {
      [880,660,880,660].forEach(function(freq){
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type='sine'; osc.frequency.value=freq;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.28, t+0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t+0.16);
        osc.connect(gain).connect(ctx.destination);
        osc.start(t); osc.stop(t+0.2);
        t += 0.22;

// ============ DAYS OFF / STANDARD / STREAK ============
function isDayOff(dateStr){ return state.daysOff.dates.indexOf(dateStr)>=0; }
function toggleDayOff(){
  const d = todayStr();
  const idx = state.daysOff.dates.indexOf(d);
  const wasOff = idx>=0;
  if(wasOff) state.daysOff.dates.splice(idx,1); else state.daysOff.dates.push(d);
  if(wasOff) playStartChime(); else playRestSound();
  persist('daysOff'); renderView();
}
function getStandardRec(dateStr){
  return state.standards.completions.find(function(c){ return c.date===dateStr; }) || {date:dateStr, doneIds:[]};
}
// Deep work = locked-in sessions of type "deep", minus time spent on tasks (or task
// categories) marked "doesn't count toward deep work" (e.g. Meta ads).
function sessionType(s){ return s.type || 'deep'; }
function rawSessionMinutesFor(dateStr, type){
  return state.focus.sessions.filter(function(s){ return s.date===dateStr && sessionType(s)===(type||'deep'); }).reduce(function(a,s){ return a+(s.minutes||0); },0);
}
function deepWorkMinutesFor(dateStr){
  return Math.max(0, rawSessionMinutesFor(dateStr,'deep') - excludedTaskMinutesFor(dateStr));
}
function deepWorkMinutesTodayLive(){
  let mins = deepWorkMinutesFor(todayStr());
  const as = state.focus.activeSession;
  if(as && sessionType(as)==='deep'){
    if(as.onBreak) mins += Math.floor((as.frozenElapsedMs||0)/60000);
    else mins += Math.floor((Date.now()-as.startedAt)/60000);
    if(ui.currentTaskId && ui.currentTaskStartedAt && !as.onBreak && !taskCountsAsDeepWork(ui.currentTaskId)) mins -= Math.floor((Date.now()-ui.currentTaskStartedAt)/60000);
  }
  return Math.max(0, mins);
}
function taskCountsAsDeepWork(taskOrId){
  const t = typeof taskOrId==='string' ? state.tasks.items.find(function(x){ return x.id===taskOrId; }) : taskOrId;
  if(!t) return true;
  if(t.countsDeepWork===false) return false;
  const cat = t.categoryId ? taskCategoryById(t.categoryId) : null;
  if(cat && cat.countsDeepWork===false) return false;
  return true;
}
function excludedTaskMinutesFor(dateStr){
  return arr(state.focus.taskSegments).filter(function(sg){ return sg.date===dateStr && sg.inSession!==false && !taskCountsAsDeepWork(sg.taskId); })
    .reduce(function(a,sg){ return a+Math.max(0, Math.round((sg.end-sg.start)/60000)); },0);
}
// Shooting time counts toward the daily standard target alongside deep work.
function standardWorkMinutesFor(dateStr){
  return deepWorkMinutesFor(dateStr) + rawSessionMinutesFor(dateStr,'shooting') + modeMinutesFor(dateStr,'shooting');
}
function fmtHours(mins){ return ((Number(mins)||0)/60).toFixed(1)+'h'; }
function manualStandardsDoneFor(dateStr){
  const items = arr(state.standards.items).filter(function(it){ return !it.createdAt || it.createdAt<=dateStr; });
  if(!items.length) return true;
  const rec = state.standards.completions.find(function(c){ return c.date===dateStr; });
  if(!rec) return false;
  return items.every(function(it){ return rec.doneIds.indexOf(it.id)>=0; });
}
function trainedDoneFor(dateStr){
  return arr(state.health.gymLog).some(function(g){ return g.date===dateStr; });
}
function ongoingStandardTasksDoneFor(dateStr){
  // Only count tasks that already existed (and were still active) on that date — a task
  // added later can't retroactively require a check-off on days before it existed, or
  // every day before its creation would wrongly show as an incomplete standard forever.
  const tasks = arr(state.tasks.items).filter(function(t){
    return t.ongoing && t.includeInStandard && t.status!=='done' && (t.createdAt||dateStr)<=dateStr;
  });
  if(!tasks.length) return true;
  return tasks.every(function(t){ return arr(t.ongoingDoneDates).indexOf(dateStr)>=0; });
}
function dayStandardsComplete(dateStr){
  const target = state.standards.deepWorkTargetMinutes || 180;
  const ov = state.standards.dayOverrides && state.standards.dayOverrides[dateStr];
  if(ov==='done') return true;
  if(ov==='missed') return false;
  const deepWorkDone = standardWorkMinutesFor(dateStr) >= target;
  const trainedOk = trainedDoneFor(dateStr);
  return deepWorkDone && trainedOk && manualStandardsDoneFor(dateStr) && ongoingStandardTasksDoneFor(dateStr);
}
function toggleStandard(id, dateStr){
  const d = dateStr || todayStr();
  let rec = state.standards.completions.find(function(c){ return c.date===d; });
  if(!rec){ rec = {date:d, doneIds:[]}; state.standards.completions.push(rec); }
  const wasAllDone = dayStandardsComplete(d);
  const idx = rec.doneIds.indexOf(id);
  if(idx>=0) rec.doneIds.splice(idx,1); else rec.doneIds.push(id);
  const nowAllDone = dayStandardsComplete(d);
  if(!wasAllDone && nowAllDone) playSessionComplete(); else playTick();
  persist('standards'); renderView();
}
// A day can look "incomplete" purely because the manual standards checklist (e.g. "Stayed within
// calorie target") was never tapped before midnight — even though deep work, training, and ongoing
// tasks were all genuinely done. Since that checklist can only ever be toggled for the day it applies
// to, once the date rolls over there was previously no way to go back and correct a simple missed tap,
// which silently and permanently broke the streak. This surfaces a small fixup prompt for exactly that
// case — yesterday only, and only when the real work was actually done — so it can't be used to fudge
// a day that was genuinely incomplete.
function yesterdayStandardsFixup(){
  const y = addDays(todayStr(), -1);
  if(dayStandardsComplete(y) || isDayOff(y)) return null;
  const target = state.standards.deepWorkTargetMinutes || 180;
  const deepWorkDone = standardWorkMinutesFor(y) >= target;
  const trainedOk = trainedDoneFor(y);
  const tasksOk = ongoingStandardTasksDoneFor(y);
  if(!(deepWorkDone && trainedOk && tasksOk)) return null;
  const rec = getStandardRec(y);
  const missing = arr(state.standards.items).filter(function(it){ return rec.doneIds.indexOf(it.id)<0; });
  if(!missing.length) return null;
  return { date:y, rec:rec, missing:missing };
}
function yesterdayStandardsFixupHtml(){
  const fix = yesterdayStandardsFixup();
  if(!fix) return '';
  return '<div class="card" style="text-align:center;border-color:var(--accent);margin-top:10px;">'+
    '<div class="kpi-label" style="margin-bottom:6px;">Looks like you did the work yesterday — just missing this:</div>'+
    '<div class="row" style="justify-content:center;">'+
      fix.missing.map(function(it){ return '<span class="chip" data-action="toggleStandard" data-id="'+it.id+'" data-date="'+fix.date+'">'+escapeHtml(it.label)+'</span>'; }).join('')+
    '</div>'+
    '<div class="kpi-sub" style="margin-top:8px;">Tap to confirm and restore yesterday to your streak.</div>'+
  '</div>';
}
function requiredWorkingDays(){ return 7 - (state.standards.daysOffAllowedPerWeek!=null ? state.standards.daysOffAllowedPerWeek : 2); }
function trailingWeekWorkingDays(dateStr){
  let count = 0;
  for(let i=0;i<7;i++){ if(dayStandardsComplete(addDays(dateStr,-i))) count++; }
  return count;
}
function trailingWeekQualifies(dateStr){ return trailingWeekWorkingDays(dateStr) >= requiredWorkingDays(); }
function computeStreak(){
  let count = 0;
  let d = new Date();
  if(!dayStandardsComplete(todayStr(d)) && !isDayOff(todayStr(d))){
    d.setDate(d.getDate()-1);
  }
  const base = state.standards.streakBase;
  while(true){
    const ds = todayStr(d);
    // A manually set count ("my streak was N as of this day") anchors the walk back.
    if(base && base.date===ds){ count += Number(base.count)||0; break; }
    if(dayStandardsComplete(ds)){ count++; d.setDate(d.getDate()-1); continue; }
    if(isDayOff(ds)){ d.setDate(d.getDate()-1); continue; }
    break;
  }
  return count;
}
function firstEverWorkedDate(){
  const dates = state.focus.sessions.map(function(s){return s.date;}).concat(
    state.standards.completions.filter(function(c){ return c.doneIds && c.doneIds.length>0; }).map(function(c){return c.date;})
  );
  if(!dates.length) return null;
  return dates.sort()[0];
}
function dayVisualStatus(dateStr){
  if(dateStr > todayStr()) return 'future';
  const startDate = firstEverWorkedDate();
  if(!startDate || dateStr < startDate) return 'neutral';
  if(dayStandardsComplete(dateStr)) return 'worked';
  let notWorkedCount = 0;
  for(let i=0;i<7;i++){
    const d = addDays(dateStr,-i);
    if(d < startDate) continue;
    if(!dayStandardsComplete(d)) notWorkedCount++;
  }
  const maxOff = state.standards.daysOffAllowedPerWeek!=null ? state.standards.daysOffAllowedPerWeek : 2;
  return notWorkedCount > maxOff ? 'failed' : 'neutral';
}
function isBreakDay(dateStr){
  if(dateStr > todayStr()) return false;
  return dayVisualStatus(dateStr)==='failed' && dayVisualStatus(addDays(dateStr,-1))!=='failed';
}
// Compact week strip for the streak card: one dot per day (3 back, today, 3 ahead).
function renderStreakWeekDots(){
  const today = todayStr();
  const days = []; for(let i=-3;i<=3;i++) days.push(addDays(today,i));
  return '<div class="streak-week">'+days.map(function(d){
    const status = isBreakDay(d) ? 'broken' : dayVisualStatus(d);
    const off = isDayOff(d) && status!=='worked';
    const cls = 'streak-dot streak-dot-'+(off?'off':status)+(d===today?' is-today':'');
    const title = weekdayShort(d)+' · '+(status==='worked'?'standard met':status==='broken'?'streak broke':off?'day off':status==='failed'?'missed':status==='future'?'upcoming':'—');
    return '<div class="streak-day" title="'+escapeHtml(title)+'"><span class="'+cls+'">'+(status==='worked'?'&#10003;':status==='broken'?'&#10005;':'')+'</span><span class="streak-day-letter">'+weekdayShort(d).slice(0,1)+'</span></div>';
  }).join('')+'</div>';
}
function renderStreakCard(streak, opts){
  opts = opts || {};
  const hot = streak>0;
  return '<div class="streak-card'+(hot?' is-hot':'')+(opts.compact?' is-compact':'')+'">'+
    '<div class="streak-main">'+
      '<span class="streak-flame">&#128293;</span>'+
      '<span class="streak-num'+(opts.ticked?' streak-tick-pop':'')+'">'+streak+'</span>'+
      '<span class="streak-unit">day'+(streak===1?'':'s')+'<br>streak</span>'+
    '</div>'+

    (opts.status ? '<div class="streak-status">'+opts.status+'</div>' : '')+
    (opts.editable ? '<button class="streak-edit-btn" data-action="openStreakEdit" title="Edit streak days">Edit</button>' : '')+
  '</div>';
}
function renderWeekGrid(){
  const today = todayStr();
  const days = []; for(let i=-3;i<=3;i++) days.push(addDays(today,i));
  return '<div class="row" style="justify-content:center;">'+days.map(function(d){
    const isToday = d===today;
    const broken = isBreakDay(d);
    const status = dayVisualStatus(d);
    if(broken){
      return '<div class="week-chip week-chip-broken" title="Streak broke here">'+weekdayShort(d).toUpperCase()+'<span class="week-chip-x">&#10005;</span></div>';
    }
    const border = status==='worked' ? '#3FBE8E' : status==='failed' ? '#E8636B' : '#262B38';
    const bg = status==='worked' ? 'rgba(63,190,142,.14)' : status==='failed' ? 'rgba(232,99,107,.14)' : '#191D27';
    return '<div class="week-chip'+(isToday?' week-chip-today':'')+'" style="border:2px solid '+border+';background:'+bg+';color:var(--text);">'+weekdayShort(d).toUpperCase()+'</div>';
  }).join('')+'</div>';
}

// ============ CHARTS ============
function svgBarChart(values, labels, opts){
  opts = opts || {};
  const w=600,h=140,padL=6,padR=6,padB=20,padT=10;
  const max = Math.max(opts.max||0, Math.max.apply(null, values.concat([1])));
  const n = values.length || 1;
  const gap = (w-padL-padR)/n;
  const barW = gap*0.55;
  let bars='', labelsSvg='';
  values.forEach(function(v,i){
    const barH = ((h-padT-padB) * (v/max)) || 0;
    const x = padL + i*gap + (gap-barW)/2;
    const y = h-padB-barH;
    bars += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+barH.toFixed(1)+'" rx="3" fill="'+(v>0?'#E8A23D':'#1e222d')+'"/>';
    if(i%2===0 || n<=8){
      labelsSvg += '<text x="'+(x+barW/2).toFixed(1)+'" y="'+(h-6)+'" font-size="8" fill="#4E5568" text-anchor="middle">'+labels[i]+'</text>';
    }
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" class="chart-svg" preserveAspectRatio="none">'+bars+labelsSvg+'</svg>';
}
function svgLineChart(values, labels){
  const w=600,h=140,pad=16;
  if(values.length===0) return '<div class="empty">Not enough data yet.</div>';
  const max=Math.max.apply(null, values), min=Math.min.apply(null, values);
  const range=(max-min)||1;
  const n=values.length;
  const stepX = n>1 ? (w-pad*2)/(n-1) : 0;
  const pts = values.map(function(v,i){
    const x = pad + i*stepX;
    const y = h-pad - ((v-min)/range)*(h-pad*2);
    return [x,y];
  });
  const path = pts.map(function(p,i){ return (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ');
  const dots = pts.map(function(p){ return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.5" fill="#E8A23D"/>'; }).join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" class="chart-svg" preserveAspectRatio="none"><path d="'+path+'" fill="none" stroke="#E8A23D" stroke-width="2"/>'+dots+'</svg>';
}
function svgRing(pct, size, color, label, sublabel){
  size = size||140;
  pct = clamp(pct,0,100);
  const r = size/2 - 10, c = size/2;
  const circumference = 2*Math.PI*r;
  const dash = circumference * pct/100;
  return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">'+
    '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="#1e222d" stroke-width="10"/>'+
    '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+dash.toFixed(1)+' '+circumference.toFixed(1)+'" transform="rotate(-90 '+c+' '+c+')"/>'+
    '<text x="'+c+'" y="'+(c-2)+'" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="18" font-weight="700" fill="#E7E9EE">'+escapeHtml(label)+'</text>'+
    (sublabel?'<text x="'+c+'" y="'+(c+16)+'" text-anchor="middle" font-size="9" fill="#8A90A2">'+escapeHtml(sublabel)+'</text>':'')+
  '</svg>';
}

function daysInProgress(t){
  if(!t.createdAt) return 0;
  const parts = t.createdAt.split('-').map(Number);
  const start = new Date(parts[0],parts[1]-1,parts[2]);
  const now = new Date(todayStr());
  return Math.max(0, Math.round((now-start)/86400000));
}
function daysAgoFrom(dateStr){
  if(!dateStr) return null;
  const p = dateStr.split('-').map(Number);
  const d = new Date(p[0],p[1]-1,p[2]);
  const tp = todayStr().split('-').map(Number);
  const now = new Date(tp[0],tp[1]-1,tp[2]);
  return Math.round((now-d)/86400000);
}
function relativeDayLabel(dateStr){
  const d = daysAgoFrom(dateStr);
  if(d===null) return null;
  if(d<=0) return 'today';
  if(d===1) return 'yesterday';
  return d+' days ago';
}

function saveEditTask(id){
  const t = state.tasks.items.find(function(x){return x.id===id;}); if(!t) return;
  const titleEl = document.getElementById('editTitle-'+id);
  t.title = titleEl.value.trim() || t.title;
  t.clients = ui.editTaskClientsSel.length ? ui.editTaskClientsSel.slice() : ['personal'];
  t.client = t.clients[0];
  t.priority = document.getElementById('editPriority-'+id).value;
  const catEl = document.getElementById('editCategory-'+id);
  t.categoryId = catEl && catEl.value ? catEl.value : null;
  t.deadline = document.getElementById('editDeadline-'+id).value || null;
  const dtEl = document.getElementById('editDeadlineTime-'+id);
  t.deadlineTime = (t.deadline && dtEl && dtEl.value) ? dtEl.value : null;
  const cdEl = document.getElementById('editCountsDeep-'+id);
  if(cdEl) t.countsDeepWork = cdEl.checked;
  t.notes = document.getElementById('editNotes-'+id).value.trim();
  const ongoingEl = document.getElementById('editOngoing-'+id);
  t.ongoing = !!(ongoingEl && ongoingEl.checked);
  if(t.ongoing){
    const ongoingDeadlineEl = document.getElementById('editOngoingDeadline-'+id);
    t.ongoingDeadline = ongoingDeadlineEl ? (ongoingDeadlineEl.value || null) : t.ongoingDeadline;
    const ongoingFrequencyEl = document.getElementById('editOngoingFrequency-'+id);
    t.ongoingFrequency = ongoingFrequencyEl ? (ongoingFrequencyEl.value || null) : t.ongoingFrequency;
    const includeStandardEl = document.getElementById('editIncludeStandard-'+id);
    t.includeInStandard = !!(includeStandardEl && includeStandardEl.checked);
  } else {

function buildUpcomingList(days){
  const cutoff = addDays(todayStr(), days||14);
  const upcoming = [];
  state.tasks.items.forEach(function(t){
    if(t.deadline && t.status!=='done' && t.deadline<=cutoff && t.deadline>=todayStr()) upcoming.push({date:t.deadline, label:t.title, kind:'deadline', id:t.id});
  });
  state.calendar.events.forEach(function(e){
    if(e.date<=cutoff && e.date>=todayStr()){
      const cat = categoryById(e.categoryId);
      upcoming.push({date:e.date, label:e.title, kind:'event', id:e.id, color: cat?cat.color:'#8A90A2'});
    }
  });
  upcoming.sort(function(a,b){ return a.date.localeCompare(b.date); });
  return upcoming;
}

  const t = e.target;
  if(!t || JOURNAL_TEXT_IDS.indexOf(t.id)<0) return;
  const imgs = imageFilesFromTransfer(e.clipboardData);
  if(!imgs.length) return;
  e.preventDefault();
  handleJournalPhotoFiles(imgs);

// Drag images (including macOS screenshots dragged off the desktop) onto a journal card.
document.addEventListener('dragover', function(e){
  if(!transferHasFiles(e.dataTransfer)) return;
  // Never let a dropped file navigate the app window away from Operator.
  e.preventDefault();
  const zone = e.target.closest && e.target.closest('[data-photo-drop]');
  document.querySelectorAll('.photo-drop-hover').forEach(function(z){ if(z!==zone) z.classList.remove('photo-drop-hover'); });
  if(zone){ zone.classList.add('photo-drop-hover'); e.dataTransfer.dropEffect = 'copy'; }
  else e.dataTransfer.dropEffect = 'none';
});
document.addEventListener('dragleave', function(e){
  const zone = e.target.closest && e.target.closest('[data-photo-drop]');
  if(zone && !zone.contains(e.relatedTarget)) zone.classList.remove('photo-drop-hover');
});
document.addEventListener('drop', function(e){
  if(!transferHasFiles(e.dataTransfer)) return;
  e.preventDefault();
  document.querySelectorAll('.photo-drop-hover').forEach(function(z){ z.classList.remove('photo-drop-hover'); });
  const zone = e.target.closest && e.target.closest('[data-photo-drop]');
  if(!zone) return;
  const kind = zone.getAttribute('data-photo-drop');
  const files = Array.prototype.slice.call(e.dataTransfer.files||[]);
  if(kind==='journal') handleJournalPhotoFiles(imageFilesFromTransfer(e.dataTransfer));
  else if(typeof ACTIONS['drop:'+kind]==='function') ACTIONS['drop:'+kind](zone, files, e);
});

// Delete with undo (tasks + video ideas). The item is removed right away and a toast
// offers Undo for a few seconds, which puts it back exactly where it was.
let lastDeletedTasks = null;
function deleteTasksUndoable(ids){
  ids = ids.filter(function(id){ return state.tasks.items.some(function(t){ return t.id===id; }); });
  if(!ids.length) return;
  const removed = [];
  state.tasks.items = state.tasks.items.filter(function(t, idx){
    if(ids.indexOf(t.id)>=0){ removed.push({task:t, index:idx}); return false; }
    return true;
  });
  ids.forEach(function(id){
    if(ui.editingTaskId===id) closeTaskEditModal();
    if(ui.editingVideoIdeaId===id) closeVideoIdeaEditModal();
    if(ui.currentTaskId===id){ accumulateCurrentTaskTime(id); }
    if(ui.stagedTaskId===id) ui.stagedTaskId = null;
    if(ui.pendingCurrentTaskId===id) ui.pendingCurrentTaskId = null;
    ui.selectedTaskIds.delete(id);
  });
  lastDeletedTasks = removed;
  persist('tasks'); renderView();
  const label = removed.length===1 ? 'Deleted “'+removed[0].task.title+'”' : 'Deleted '+removed.length+' items';
  showToast(label, {icon:'&#128465;', actionLabel:'Undo', actionAction:'undoDeleteTasks', duration:7000});
}
ACTIONS.deleteTaskUndoable = function(el, e, id){ deleteTasksUndoable([id]); };
ACTIONS.undoDeleteTasks = function(){
  if(!lastDeletedTasks) return;
  lastDeletedTasks.slice().sort(function(a,b){ return a.index-b.index; }).forEach(function(r){
    if(state.tasks.items.some(function(t){ return t.id===r.task.id; })) return;
    state.tasks.items.splice(Math.min(r.index, state.tasks.items.length), 0, r.task);
  });
  lastDeletedTasks = null;
  const c = document.getElementById('toastContainer'); if(c) c.innerHTML='';
  playTick();
  persist('tasks'); renderView();
};

function renderToday(){

  if(isDayOff(todayStr())) return renderDayOffView();
  if(state.modes.active && state.modes.active.type==='offtime') return state.modes.active.sleep ? renderSleepView() : renderOffTimeView();
  const hour = new Date().getHours();
  const greeting = hour<5 ? 'Still up' : hour<12 ? 'Good morning' : hour<18 ? 'Good afternoon' : 'Good evening';
  const order = arr(state.dashboardPanels.order);
  const enabledOrder = order.filter(function(pid){ return state.dashboardPanels.enabled[pid]!==false; });
  let panelsHtml = '';
  let i = 0;
  while(i < enabledOrder.length){
    const pid = enabledOrder[i];

      while(i<enabledOrder.length && SMALL_PANELS.indexOf(enabledOrder[i])>=0){ rowPanels.push(enabledOrder[i]); i++; }

    } else {

  return renderFocusQuickLinks()+

      businessNameTagHtml()+

function taskPriorityRank(t){ return t.priority==='high'?0:t.priority==='med'?1:2; }
function taskDeadlineSortKey(t){ return t.deadline || '9999-99-99'; }
function sortByPriorityAndDeadline(list){
  return list.slice().sort(function(a,b){
    const ao = a.ongoing?1:0, bo = b.ongoing?1:0;
    if(ao!==bo) return ao-bo;
    const pr = taskPriorityRank(a)-taskPriorityRank(b);
    if(pr!==0) return pr;
    return taskDeadlineSortKey(a).localeCompare(taskDeadlineSortKey(b));
  });
}

function accumulateCurrentTaskTime(taskId){
  if(ui.currentTaskId!==taskId || !ui.currentTaskStartedAt) return;
  const t=state.tasks.items.find(function(x){return x.id===taskId;});
  if(t){
    const now = Date.now();
    const mins = Math.max(0, Math.round((now-ui.currentTaskStartedAt)/60000));
    t.trackedMinutes = (t.trackedMinutes||0) + mins;
    // Timing log per task, so analytics can say what each session was spent on and
    // deep-work exclusions can be subtracted from the right day.
    if(now-ui.currentTaskStartedAt >= 30000){
      if(!Array.isArray(state.focus.taskSegments)) state.focus.taskSegments = [];
      const as = state.focus.activeSession;
      state.focus.taskSegments.push({id:uid(), taskId:taskId, start:ui.currentTaskStartedAt, end:now, date:todayStr(new Date(ui.currentTaskStartedAt)), inSession:!!as, sessionType: as ? sessionType(as) : null});
      persist('focus');
    }
  }
  ui.currentTaskId = null;
  ui.currentTaskStartedAt = null;
}
function setCurrentTask(taskId){
  const t = state.tasks.items.find(function(x){return x.id===taskId;});
  if(!t || t.status==='done' || ui.currentTaskId===taskId) return;
  const as = state.focus.activeSession;
  if(as && as.onBreak) return;
  if(ui.currentTaskId) accumulateCurrentTaskTime(ui.currentTaskId);
  ui.currentTaskId = taskId;
  ui.currentTaskStartedAt = Date.now();

}

function completeTask(id){
  const t=state.tasks.items.find(function(x){return x.id===id;}); if(!t) return;
  if(justCompletedTaskId===id) return;
  if(ui.currentTaskId===id) accumulateCurrentTaskTime(id);
  if(t.ongoing){
    if(!Array.isArray(t.ongoingDoneDates)) t.ongoingDoneDates=[];
    if(t.ongoingDoneDates.indexOf(todayStr())<0) t.ongoingDoneDates.push(todayStr());
    playTaskComplete();
    justCompletedTaskId = id;
    persist('tasks'); renderView();
    setTimeout(function(){ if(justCompletedTaskId===id){ justCompletedTaskId=null; renderView(); } }, 950);
    showToast('Nice — logged for today. Resets tomorrow.', {icon:'&#128204;'});
    return;
  }
  playTaskComplete();
  justCompletedTaskId = id;
  renderView();
  setTimeout(function(){
    const t2 = state.tasks.items.find(function(x){return x.id===id;});
    if(t2 && justCompletedTaskId===id){
      t2.status='done'; t2.completedAt=todayStr();
      if(state.focus.activeSession){
        if(!Array.isArray(state.focus.activeSession.completedTasks)) state.focus.activeSession.completedTasks=[];
        state.focus.activeSession.completedTasks.push({id:t2.id, title:t2.title, client:t2.client, note:'', noteFinalized:false});
        persist('focus');
      }
      persist('tasks');
    }
    if(justCompletedTaskId===id) justCompletedTaskId=null;
    renderView();
  }, 550);
}
function undoTask(id){
  const t=state.tasks.items.find(function(x){return x.id===id;}); if(!t) return;
  if(justCompletedTaskId===id){ justCompletedTaskId=null; renderView(); return; }
  if(t.ongoing){
    t.ongoingDoneDates = arr(t.ongoingDoneDates).filter(function(d){ return d!==todayStr(); });
    persist('tasks'); renderView();
    return;
  }
  t.status='today'; t.completedAt=null;
  if(state.focus.activeSession && Array.isArray(state.focus.activeSession.completedTasks)){
    state.focus.activeSession.completedTasks = state.focus.activeSession.completedTasks.filter(function(x){ return x.id!==id; });
    persist('focus');
  }
  persist('tasks'); renderView();
}

function formatElapsed(ms){
  ms = Math.max(0, ms);
  const totalSec = Math.floor(ms/1000);
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
  return (h>0?pad2(h)+':':'')+pad2(m)+':'+pad2(s);
}
function computeTimeOfDayBuckets(){
  const buckets = [
    {label:'6-9a', start:6, end:9, minutes:0},
    {label:'9-12p', start:9, end:12, minutes:0},
    {label:'12-3p', start:12, end:15, minutes:0},
    {label:'3-6p', start:15, end:18, minutes:0},
    {label:'6-9p', start:18, end:21, minutes:0},
    {label:'9p-12a', start:21, end:24, minutes:0}
  ];
  qualifyingSessions().forEach(function(s){
    const hour = new Date(s.startedAt).getHours();
    const b = buckets.find(function(b){ return hour>=b.start && hour<b.end; });
    if(b) b.minutes += s.minutes;
  });
  return buckets;
}
function qualifyingSessions(){ return state.focus.sessions.filter(function(s){ return (s.minutes||0)>=5 && sessionType(s)==='deep'; }); }

function stasisMinutesForDate(dateStr){
  const dw = deepWorkMinutesFor(dateStr);
  const br = modeMinutesFor(dateStr,'break');
  const off = modeMinutesFor(dateStr,'offtime');
  const shoot = modeMinutesFor(dateStr,'shooting');
  let windowMins;
  if(dateStr===todayStr()){
    const now = new Date();
    windowMins = now.getHours()*60+now.getMinutes();
  } else {
    windowMins = 1440;
  }
  return Math.max(0, windowMins - dw - br - off - shoot);
}
function allTimeStasisMinutes(){
  const days = new Set();
  state.focus.sessions.forEach(function(s){ days.add(s.date); });
  state.modes.history.forEach(function(m){ days.add(m.date); });
  let total = 0;
  days.forEach(function(d){ total += stasisMinutesForDate(d); });
  return total;
}

// ---- Per-day totals by mode ----
function liveModeMinutes(dateStr, type){
  const a = state.modes.active;
  if(!a || a.type!==type || dateStr!==todayStr()) return 0;
  return Math.floor((Date.now()-Math.max(a.startedAt, localTs(dateStr,'00:00')))/60000);
}
function dayModeTotals(dateStr){
  const isToday = dateStr===todayStr();
  const deep = isToday ? deepWorkMinutesTodayLive() : deepWorkMinutesFor(dateStr);
  const as = state.focus.activeSession;
  const liveSession = function(type){ return (isToday && as && sessionType(as)===type && !as.onBreak) ? Math.floor((Date.now()-as.startedAt)/60000) : 0; };
  const training = rawSessionMinutesFor(dateStr,'training') + modeMinutesFor(dateStr,'training') + liveModeMinutes(dateStr,'training') + liveSession('training');
  const shooting = rawSessionMinutesFor(dateStr,'shooting') + modeMinutesFor(dateStr,'shooting') + liveModeMinutes(dateStr,'shooting') + liveSession('shooting');
  let excludedLive = 0;
  if(isToday && as && !as.onBreak && ui.currentTaskId && ui.currentTaskStartedAt && !taskCountsAsDeepWork(ui.currentTaskId)) excludedLive = Math.floor((Date.now()-ui.currentTaskStartedAt)/60000);
  const other = modeMinutesFor(dateStr,'break') + liveModeMinutes(dateStr,'break') + excludedTaskMinutesFor(dateStr) + excludedLive;

function weekStackChart(days, selected){

      '<rect x="'+(i*gap+2).toFixed(1)+'" y="0" width="'+(gap-4).toFixed(1)+'" height="'+h+'" fill="'+(isSel?'rgba(232,162,61,.08)':'transparent')+'" rx="6"/>'+
      (t && !t.total ? '<rect x="'+x.toFixed(1)+'" y="'+(h-padB-2)+'" width="'+barW.toFixed(1)+'" height="2" fill="#262B38"/>' : '')+
      segs+

      (t && t.total ? '<text x="'+(x+barW/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" font-size="9.5" fill="#8A90A2" text-anchor="middle">'+fmtDurationLabel(t.total)+'</text>' : '')+
    '</g>';

function sessionWindowsFor(dateStr){

  const as = state.focus.activeSession;
  if(as && dateStr===todayStr()) wins.push([as.startedAt, Date.now()]);
  return wins;

function clipIntervalsToWindows(intervals, windows){
  const map = {};
  arr(intervals).forEach(function(iv){
    windows.forEach(function(w){
      const s = Math.max(iv.start, w[0]), e = Math.min(iv.end, w[1]);
      if(e>s) map[iv.app] = (map[iv.app]||0) + (e-s)/60000;
    });
  });
  Object.keys(map).forEach(function(k){ map[k] = Math.round(map[k]); if(!map[k]) delete map[k]; });
  return map;
}
function lockedInAppMinutesFor(dateStr){

// ============ APP ACTIVITY TRACKING ============
// Data flow: the native Operator wrapper script polls the frontmost macOS app every
// ~10s (via osascript/System Events) and serves recent "<timestamp>\t<appName>[\t<idleSeconds>]"
// lines (idleSeconds = time since the last keyboard/mouse input; older wrappers omit it)
// over a local, loopback-only HTTP endpoint (APP_ACTIVITY_URL). This page polls that
// endpoint, turns the raw samples into continuous per-app intervals, keeps a rolling
// per-day minutes total, and (optionally) auto-starts/ends a real focus session when
// the same app holds the foreground for a while. None of this leaves the machine.
const APP_ACTIVITY_GAP_MS = 30000; // >30s with no matching sample = treat as a gap/idle
let autoLockInMeta = { app:null, intervalStart:null };
function parseActivityLogText(text){
  const lines = String(text||'').split('\n');
  const out = [];
  for(let i=0;i<lines.length;i++){
    const line = lines[i];
    if(!line) continue;
    const tab = line.indexOf('\t');
    if(tab<0) continue;
    const ts = parseInt(line.slice(0,tab),10);
    const rest = line.slice(tab+1);
    const tab2 = rest.indexOf('\t');
    const app = (tab2<0 ? rest : rest.slice(0,tab2)).trim();
    const idle = tab2<0 ? null : parseInt(rest.slice(tab2+1),10);
    if(!ts || !app) continue;
    out.push({ts:ts, app:app, idle:(idle==null || isNaN(idle)) ? null : idle});
  }
  return out;
}
function samplesToIntervals(samples){
  const intervals = [];
  let cur = null;
  samples.forEach(function(s){
    if(cur && cur.app===s.app && (s.ts-cur.end)<=APP_ACTIVITY_GAP_MS){
      cur.end = s.ts;
    } else {
      if(cur) intervals.push(cur);
      cur = {app:s.app, start:s.ts, end:s.ts};
    }
  });
  if(cur) intervals.push(cur);
  return intervals;
}
function intervalsToAppMinutes(intervals){
  const map = {};
  arr(intervals).forEach(function(iv){
    const mins = Math.max(0, Math.round((iv.end-iv.start)/60000));
    if(mins<=0) return;
    map[iv.app] = (map[iv.app]||0) + mins;
  });
  return map;
}
function maxAppMinutes(base, add){
  const out = Object.assign({}, base||{});
  Object.keys(add||{}).forEach(function(k){ out[k]=Math.max(out[k]||0, add[k]); });
  return out;
}
function appMinutesForDate(dateStr){
  if(dateStr===todayStr()) return intervalsToAppMinutes(state.appActivity.todayIntervals);
  return state.appActivity.days[dateStr] || {};
}
function topAppsForDate(dateStr, n){
  const mins = appMinutesForDate(dateStr);
  return Object.keys(mins).map(function(app){ return {app:app, minutes:mins[app]}; })
    .sort(function(a,b){ return b.minutes-a.minutes; }).slice(0, n||8);
}
function topAppsAllTime(n){
  const totals = {};
  Object.keys(state.appActivity.days).forEach(function(d){
    const m = state.appActivity.days[d];
    Object.keys(m).forEach(function(app){ totals[app]=(totals[app]||0)+m[app]; });
  });
  const todayMins = intervalsToAppMinutes(state.appActivity.todayIntervals);
  Object.keys(todayMins).forEach(function(app){ totals[app]=(totals[app]||0)+todayMins[app]; });
  return Object.keys(totals).map(function(app){ return {app:app, minutes:totals[app]}; })
    .sort(function(a,b){ return b.minutes-a.minutes; }).slice(0, n||8);
}
function currentForegroundApp(){
  const ivs = state.appActivity.todayIntervals;
  if(!ivs.length) return null;
  const last = ivs[ivs.length-1];
  if(Date.now()-last.end > APP_ACTIVITY_GAP_MS) return null; // stale sample — likely idle/asleep
  return last.app;
}
function updateCurrentAppIndicator(){
  const el = document.getElementById('currentAppIndicator');
  if(!el) return;
  const st = state.settings.appTracking;
  if(!st || st.enabled===false){ el.textContent=''; el.style.display='none'; return; }
  const app = currentForegroundApp();
  if(app){ el.textContent = '\u25CF '+app; el.style.display = 'block'; }
  else { el.textContent=''; el.style.display='none'; }
}
async function pollAppActivity(){
  const st = state.settings.appTracking;
  if(!st || st.enabled===false) { updateCurrentAppIndicator(); return; }
  let text;
  try{
    const res = await fetch(APP_ACTIVITY_URL, {cache:'no-store'});
    if(!res.ok) return;
    text = await res.text();
  }catch(e){ return; } // no wrapper/server running — silently do nothing
  // Only count active usage: a sample taken after the keyboard/mouse has been idle for a
  // while is dropped, which leaves a gap that splits the interval (an app just sitting in
  // the foreground no longer counts as "being on it").
  const idleLimit = Number(st.idleSeconds)||60;
  const samples = parseActivityLogText(text).filter(function(s){ return s.idle==null || s.idle < idleLimit; });
  if(!samples.length){ updateCurrentAppIndicator(); return; }
  const today = todayStr();
  const byDate = {};
  samples.forEach(function(s){ const d = todayStr(new Date(s.ts)); (byDate[d]=byDate[d]||[]).push(s); });
  Object.keys(byDate).forEach(function(d){
    if(d===today) return; // only finalize PAST days; today stays live below
    const ivs = samplesToIntervals(byDate[d].sort(function(a,b){return a.ts-b.ts;}));
    // The log is re-read in full on every poll, so a past day's samples show up again and
    // again. Keep the larger of stored vs. recomputed per app (idempotent) instead of adding,
    // which used to inflate past days by another copy every 15 seconds.
    state.appActivity.days[d] = maxAppMinutes(state.appActivity.days[d], intervalsToAppMinutes(ivs));
    // Also keep the part that happened while locked in (Analytics shows that first).
    if(!state.appActivity.lockedDays) state.appActivity.lockedDays = {};
    state.appActivity.lockedDays[d] = maxAppMinutes(state.appActivity.lockedDays[d], clipIntervalsToWindows(ivs, sessionWindowsFor(d)));
  });
  const todaySamples = (byDate[today]||[]).sort(function(a,b){return a.ts-b.ts;});
  state.appActivity.todayIntervals = samplesToIntervals(todaySamples);
  state.appActivity.todayDate = today;
  persist('appActivity');
  updateCurrentAppIndicator();
  checkAutoLockIn();
  if(ui.view==='focus' && ui.focusTab==='analytics') renderView();
}
// Why auto lock-in is currently held back (or null when it's allowed to run).
function autoLockInBlockedReason(){
  if(isDayOff(todayStr())) return 'dayoff';
  if(state.modes.active) return 'mode';
  const st = state.settings.appTracking || {};
  const cooldownMs = Math.max(0, Number(st.cooldownMinutes)||0)*60000;
  const lastStop = state.focus.lastManualStopAt;
  if(lastStop && Date.now()-lastStop < cooldownMs) return 'cooldown';
  return null;
}
// Steady usage only counts from the latest point that resets it: the current app interval's
// start, the end of the last session (manual or auto), the end of the cooldown after a
// manual lock-out, or the end of off-time/shooting. Without this, an app that had been in
// the foreground during the session itself counted toward auto lock-in the moment you
// locked out.
function autoLockInCountFrom(interval){
  const st = state.settings.appTracking || {};
  const cooldownMs = Math.max(0, Number(st.cooldownMinutes)||0)*60000;
  let from = interval.start;
  if(state.focus.lastSessionEndedAt) from = Math.max(from, state.focus.lastSessionEndedAt);
  if(state.focus.lastManualStopAt) from = Math.max(from, state.focus.lastManualStopAt + cooldownMs);
  if(state.modes.lastEndedAt) from = Math.max(from, state.modes.lastEndedAt);
  return from;
}
function checkAutoLockIn(){
  const st = state.settings.appTracking;
  if(!st || st.enabled===false || st.autoLockIn===false) return;
  const ivs = state.appActivity.todayIntervals;
  if(!ivs.length) return;
  const last = ivs[ivs.length-1];
  const isLive = (Date.now()-last.end) <= APP_ACTIVITY_GAP_MS;
  const activeSession = state.focus.activeSession;

  if(isLive && !activeSession){
    if(autoLockInBlockedReason()) return;
    const elapsedMin = (last.end-autoLockInCountFrom(last))/60000;
    if(elapsedMin >= (st.thresholdMinutes||12) && autoLockInMeta.intervalStart!==last.start){
      autoLockInMeta = {app:last.app, intervalStart:last.start};
      startFocus(null);
      if(state.focus.activeSession) state.focus.activeSession.autoStarted = true;
      persist('focus');
      showToast('Auto-locked in \u2014 you\u2019ve been on '+last.app+' for '+Math.round(elapsedMin)+' min', {icon:'&#128274;'});
    }
    return;
  }

  if(activeSession && activeSession.autoStarted){
    if(!isLive) return; // idle/away — leave it running rather than guess
    if(last.app === autoLockInMeta.app){ autoLockInMeta.intervalStart = last.start; return; }
    const awayMin = (Date.now()-last.start)/60000;
    if(awayMin >= (st.graceMinutes||3)){
      autoEndFocusSession();
      autoLockInMeta = {app:null, intervalStart:null};
    }
  }
}
function autoEndFocusSession(){
  const s = state.focus.activeSession;
  if(!s) return;
  const endedAt = Date.now();
  const minutes = Math.max(1, Math.round((endedAt-s.startedAt)/60000));
  if(ui.currentTaskId){ accumulateCurrentTaskTime(ui.currentTaskId); persist('tasks'); }
  state.focus.sessions.push({id:uid(), type:sessionType(s), date:todayStr(new Date(s.startedAt)), startedAt:s.startedAt, endedAt:endedAt, minutes:minutes, completedTasks:arr(s.completedTasks), note:'', autoStopped:true});
  state.focus.activeSession = null;
  state.focus.lastSessionEndedAt = endedAt;
  if(ui.currentTaskId){ accumulateCurrentTaskTime(ui.currentTaskId); persist('tasks'); }
  if(state.modes.active && state.modes.active.linkedFocus){ endMode(); }
  playStopSound();
  persist('focus'); renderView();
  showToast('Auto-ended focus session \u2014 you switched apps', {icon:'&#9209;'});
}
function startAppActivityPolling(){
  pollAppActivity();
  setInterval(pollAppActivity, 15000);
}

function renderJournalHistory(entries){
  const pinned = entries.filter(function(e){return e.pinned;});
  const rest = entries.filter(function(e){return !e.pinned;});
  const groups = {}; const order = [];
  rest.forEach(function(e){ if(!groups[e.date]){ groups[e.date]=[]; order.push(e.date); } groups[e.date].push(e); });
  let html = '';
  if(pinned.length) html += '<div class="kind-label">Pinned</div>'+pinned.map(journalEntryRow).join('');
  order.forEach(function(d){
    const label = d===todayStr() ? 'Today' : d===addDays(todayStr(),-1) ? 'Yesterday' : fmtDateShort(d);
    html += '<div class="kind-label">'+label+'</div>'+groups[d].map(journalEntryRow).join('');
  });
  return html || '<div class="empty">Nothing matches yet.</div>';
}
function filteredJournalEntries(){
  const allEntries = state.journal.entries.slice().sort(function(a,b){ return b.timestamp-a.timestamp; });
  const searchLower = (ui.journalSearchText||'').toLowerCase();

    const matchesMood = !ui.journalFilterMood || e.mood===ui.journalFilterMood;
    const matchesSearch = !searchLower || e.text.toLowerCase().indexOf(searchLower)>=0;
    return matchesMood && matchesSearch;
  });
}
