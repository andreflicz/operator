      '<div style="text-align:center;"><div class="kpi-label" style="margin-bottom:6px;">Goals Achieved</div><div class="ring-wrap" style="'+goalGlowFilter(achievedPct)+'">'+svgRing(achievedPct,130,goalColor(),done.length+'/'+items.length,items.length?'of your goals':'none set yet')+'</div></div>'+
    '</div></div>'+

      '<div class="field"><label>Unit (optional)</label><input class="input" id="newGoalUnit" placeholder="e.g. lbs, $/mo, days" style="width:100%;"></div>'+
    '</div>'+
    '<div class="grid grid-2" style="margin-top:12px;">'+
      '<div class="field"><label>Deadline (optional)</label><div class="row"><input class="input" type="date" id="newGoalDeadline" style="flex:1;"><button class="btn btn-ghost btn-sm" data-action="openDatePicker" data-target="newGoalDeadline">&#128197;</button></div></div>'+

function goalLiveCurrent(g){
  if(g.autoTrack==='streak') return computeStreak();
  return g.current||0;
}
function goalDeadlineTag(g){
  if(!g.deadline) return '';
  const days = Math.ceil((new Date(g.deadline+'T00:00:00') - new Date(todayStr()+'T00:00:00'))/86400000);
  let cls='tag', label;
  if(days<0){ cls='tag tag-danger'; label='Past due'; }
  else if(days===0){ cls='tag tag-med'; label='Due today'; }
  else if(days<=7){ cls='tag tag-med'; label=days+'d left'; }
  else { cls='tag'; label=fmtDateShort(g.deadline); }
  return '<span class="'+cls+'" style="margin-left:8px;">'+label+'</span>';
}
function goalRow(g){
  const hasTracker = g.target!=null && g.target>0;
  const current = goalLiveCurrent(g);
  if(g.autoTrack==='streak' && hasTracker && current>=g.target && !g.done){ g.done=true; }
  const pct = hasTracker ? clamp(Math.round(current/g.target*100),0,100) : 0;
  const isArmed = armed.has('goalcomplete:'+g.id);
  return '<div class="task-item-v2 '+(g.done?'done':'')+'" style="'+(hasTracker?'':'align-items:center;')+'">'+
    '<button class="btn btn-sm '+(g.done?'btn-good':(isArmed?'btn-primary':'btn-ghost'))+'" data-action="toggleGoal" data-id="'+g.id+'" style="flex-shrink:0;">'+(g.done?'&#10003; Done':(isArmed?'Confirm?':'Mark Done')) +'</button>'+
    '<div style="flex:1;min-width:160px;">'+
      '<div class="task-title">'+escapeHtml(g.label)+(g.autoTrack==='streak'?'<span class="tag" style="margin-left:8px;">&#128293; Streak</span>':'')+goalDeadlineTag(g)+'</div>'+
      (hasTracker ? (
        '<div class="progress" style="margin-top:6px;max-width:220px;"><div class="progress-bar" style="width:'+pct+'%;background:'+goalColor()+';'+goalGlowStyle(pct)+'"></div></div>'+
        '<div class="kpi-sub" style="margin-top:4px;">'+current+' / '+g.target+' '+escapeHtml(g.unit||'')+'</div>'
      ) : '')+
    '</div>'+
    '<button class="btn btn-ghost btn-sm" data-action="openGoalEditModal" data-id="'+g.id+'">Edit</button>'+
  '</div>';
}

function saveEditGoal(id){
  const g = state.goals.items.find(function(x){return x.id===id;}); if(!g) return;
  g.label = document.getElementById('editGoalLabel-'+id).value.trim() || g.label;
  g.target = Number(document.getElementById('editGoalTarget-'+id).value) || null;
  g.unit = document.getElementById('editGoalUnit-'+id).value.trim();
  const deadlineEl = document.getElementById('editGoalDeadline-'+id);
  g.deadline = deadlineEl && deadlineEl.value ? deadlineEl.value : null;
  const trackModeEl = document.getElementById('editGoalTrackMode-'+id);
  g.autoTrack = (trackModeEl && trackModeEl.value==='streak') ? 'streak' : null;
  if(g.autoTrack==='streak'){
    g.current = computeStreak();
  } else {
    const curEl = document.getElementById('editGoalCurrent-'+id);
    if(curEl){
      const val = Number(curEl.value);
      if(!isNaN(val)) g.current = val;
    }
  }
  if(g.target && g.current>=g.target && !g.done){ g.done=true; playSessionComplete(); }
  closeGoalEditModal();
  persist('goals'); renderView();
}
function addGoal(){
  const el = document.getElementById('newGoalLabel');
  const label = el.value.trim();
  if(!label) return;
  const target = Number(document.getElementById('newGoalTarget').value) || null;
  const unit = document.getElementById('newGoalUnit').value.trim();
  const deadlineEl = document.getElementById('newGoalDeadline');
  const deadline = deadlineEl && deadlineEl.value ? deadlineEl.value : null;
  const trackModeEl = document.getElementById('newGoalTrackMode');
  const autoTrack = (trackModeEl && trackModeEl.value==='streak') ? 'streak' : null;
  const current = autoTrack==='streak' ? computeStreak() : 0;
  state.goals.items.push({id:uid(), label:label, done:false, target:target, current:current, unit:unit, deadline:deadline, autoTrack:autoTrack, createdAt:todayStr()});
  playSessionComplete();
  persist('goals'); renderView();
}
function toggleGoal(id){
  const g = state.goals.items.find(function(x){ return x.id===id; }); if(!g) return;
  if(g.done){ g.done = false; playTick(); persist('goals'); renderView(); return; }
  const key = 'goalcomplete:'+id;
  if(!armed.has(key)){
    armed.add(key); renderView();
    setTimeout(function(){ if(armed.has(key)){ armed.delete(key); renderView(); } }, 3000);
    return;
  }
  armed.delete(key);
  g.done = true;
  playSessionComplete();
  persist('goals'); renderView();
}

function renderWishlistTab(){
  const items = arr(state.personal.wishlist);
  const rank = {high:0, med:1, low:2};
  const open = items.filter(function(w){ return !w.purchased; }).sort(function(a,b){ return (rank[a.priority]-rank[b.priority]) || wishPrice(b)-wishPrice(a); });
  const bought = items.filter(function(w){ return w.purchased; });
  const total = open.reduce(function(a,w){ return a+wishPrice(w); },0);
  const mustTotal = open.filter(function(w){ return w.priority==='high'; }).reduce(function(a,w){ return a+wishPrice(w); },0);
  return '<div class="wish-total card">'+
      '<div><div class="kpi-label">Still to buy</div><div class="wish-total-val">'+fmtMoney(total)+'</div><div class="kpi-sub">'+open.length+' item'+(open.length===1?'':'s')+(mustTotal?' &middot; '+fmtMoney(mustTotal)+' must-haves':'')+'</div></div>'+

function manualTouchesThisWeek(c){
  const wk = thisWeekKey();
  return arr(c.touches).filter(function(t){ return startOfWeekStr(t)===wk; }).length;
}
function deliverableWeekCount(d){
  const wk = thisWeekKey(), wkEnd = endOfWeekStr(todayStr());
  return arr(d.completedDates).filter(function(dt){ return dt>=wk && dt<=wkEnd; }).length;
}
function deliverableMonthCount(d){
  const mk = thisMonthKey();
  return arr(d.completedDates).filter(function(dt){ return monthKeyOf(dt)===mk; }).length;
}
function monthlyTargetFor(d){
  const target = d.weeklyTarget||1;
  const now = new Date();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  return Math.max(1, Math.round(target * daysInMonth/7));
}
function deliverablePaceStatus(d){
  const monthlyTarget = monthlyTargetFor(d);
  const now = new Date();
  const dayOfMonth = now.getDate();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const doneThisMonth = deliverableMonthCount(d);
  const expected = monthlyTarget * (dayOfMonth/daysInMonth);
  if(doneThisMonth>=monthlyTarget) return 'good';
  if(expected<=0) return 'good';
  const ratio = doneThisMonth/expected;
  if(ratio>=1) return 'good';
  if(ratio>=0.6) return 'warn';
  return 'danger';
}
function isDeliverableDoneThisWeek(d){
  if(d.recurring){
    if(deliverableMonthCount(d) >= monthlyTargetFor(d)) return true;
    return deliverableWeekCount(d) >= (d.weeklyTarget||1);
  }
  return d.status==='done';
}
function deliverablesDoneThisWeek(c){
  const wk = thisWeekKey();
  return arr(c.deliverables).filter(function(d){
    if(d.recurring) return isDeliverableDoneThisWeek(d);
    return d.status==='done' && d.completedAt && startOfWeekStr(d.completedAt)===wk;
  }).length;
}
function incrementDeliverableProgress(clientId, deliverableId){
  const c = state.business.clients.find(function(x){return x.id===clientId;}); if(!c) return;
  const d = arr(c.deliverables).find(function(x){return x.id===deliverableId;}); if(!d) return;
  if(!Array.isArray(d.completedDates)) d.completedDates=[];
  const target = d.weeklyTarget||1;
  const count = deliverableWeekCount(d);
  d.completedDates.push(todayStr());
  if(count+1>=target) playTaskComplete(); else playTick();
  persist('business'); renderView();
  // Logging progress always counts, locked in or not — just a heads-up, not a gate.
  if(!state.focus.activeSession) showLockInToast();
}
function undoDeliverableProgress(clientId, deliverableId){
  const c = state.business.clients.find(function(x){return x.id===clientId;}); if(!c) return;
  const d = arr(c.deliverables).find(function(x){return x.id===deliverableId;}); if(!d) return;

}

function clientHealthStatus(c){
  // Health is the worse of: deliverable pace (are we on track for reels/ads this month?)
  // and communication (how recently have we logged a touch with this client?).
  const recurring = arr(c.deliverables).filter(function(d){ return d.recurring; });
  const paceLevels = recurring.map(deliverablePaceStatus);
  const worstPace = paceLevels.indexOf('danger')>=0 ? 'danger' : paceLevels.indexOf('warn')>=0 ? 'warn' : 'good';
  const careTier = clientCareTier(c);
  const careLevel = careTier.cls==='tag-danger' ? 'danger' : careTier.cls==='tag-warn' ? 'warn' : 'good';
  const rank = {good:0, warn:1, danger:2};
  const worst = rank[worstPace] >= rank[careLevel] ? worstPace : careLevel;
  const level = worst==='danger' ? 'red' : worst==='warn' ? 'yellow' : 'green';
  return {level:level, paceLevel:worstPace, careLevel:careLevel, hasDeliverables:recurring.length>0};
}

// Communication health follows the client's touch cadence: fine until the next touch is
// due, amber once it's overdue, red when overdue by more than half the cadence.
function clientCareTier(c){
  const last = crmLastTouch('client', c) || lastTouchInfo(c);
  // A client with no touch yet is measured from when they were added (same as the cadence).
  const base = last || c.createdAt || c.startDate;
  if(!base) return {cls:'tag-danger', label:'Never touched'};
  if(last && daysAgoFrom(last)<=0) return {cls:'tag-good', label:'Touched today'};
  const cad = crmCadence('client', c);
  const over = daysAgoFrom(addDays(base, cad));
  if(over < 0) return {cls:'tag-good', label: last ? 'In touch' : 'New — no touch yet'};
  if(over <= Math.max(1, Math.floor(cad/2))) return {cls:'tag-warn', label: over===0 ? 'Touch due today' : 'Touch overdue '+over+'d'};
  return {cls:'tag-danger', label:'No touch in '+daysAgoFrom(last)+'d'};
}

}

// Swapping or removing a client's package used to throw away every logged deliverable
// (all the dated "+1"s) for that client. Progress is now kept per deliverable title and
// handed back whenever a package with a matching deliverable is assigned again.
function packageProgressKey(title){ return String(title||'').trim().toLowerCase(); }
function archivePackageProgress(c){
  if(!c.packageProgressArchive || typeof c.packageProgressArchive!=='object') c.packageProgressArchive = {};
  arr(c.deliverables).forEach(function(d){
    if(!d.fromPackage || !arr(d.completedDates).length) return;
    const k = packageProgressKey(d.title);
    const prev = arr(c.packageProgressArchive[k]);
    const merged = prev.concat(arr(d.completedDates));
    c.packageProgressArchive[k] = merged;
  });
}
function restoredPackageProgress(c, pkgDeliverable){
  const k = packageProgressKey(pkgDeliverable.title);
  const archive = c.packageProgressArchive || {};
  const dates = arr(archive[k]).slice();
  if(dates.length) delete archive[k];
  return dates;
}
function clearClientPackage(clientId){
  const c = state.business.clients.find(function(x){return x.id===clientId;}); if(!c) return;

function toggleDeliverable(clientId, deliverableId){
  const c = state.business.clients.find(function(x){return x.id===clientId;}); if(!c) return;
  const d = arr(c.deliverables).find(function(x){return x.id===deliverableId;}); if(!d) return;
  if(d.recurring){
    incrementDeliverableProgress(clientId, deliverableId);
    return;
  }
  d.status = d.status==='done' ? 'pending' : 'done';
  d.completedAt = d.status==='done' ? todayStr() : null;
  if(d.linkedTaskId){
    const t = state.tasks.items.find(function(x){return x.id===d.linkedTaskId;});
    if(t){
      if(d.status==='done'){ t.status='done'; t.completedAt=todayStr(); } else { t.status='backlog'; t.completedAt=null; }
      persist('tasks');
    }
  }
  if(d.status==='done') playTaskComplete();
  persist('business'); renderView();
}

  if(!p) return null;

    touchpoints:tps, touches:tps.map(function(t){ return t.date; }), files:arr(p.files).map(function(f){ return Object.assign({}, f); }),
    timeline:arr(p.timeline).map(function(t){ return Object.assign({}, t); }).concat([{id:uid(), ts:Date.now(), type:'stage', text:'Won — converted from lead'}]),
    cadenceDays:null, fromLeadId:p.id, startDate:todayStr(), createdAt:todayStr()});
  p.convertedClientId = clientId;
  return clientId;
}
function advanceStageQuiet(id){

  const idx = STAGE_ORDER.indexOf(p.stage);
  if(idx>=0 && idx<STAGE_ORDER.length-1){
    if(!Array.isArray(p.stageHistory)) p.stageHistory=[];
    p.stageHistory.push(p.stage);
    p.stage = STAGE_ORDER[idx+1];
  }
  if(p.stage==='closed') convertProspectToClient(p);
}
function advanceStage(id){
  const p = state.business.pipeline.find(function(x){ return x.id===id; }); if(!p) return;
  const idx = STAGE_ORDER.indexOf(p.stage);
  if(idx>=0 && idx<STAGE_ORDER.length-1){

    p.stageHistory.push(p.stage);
    p.stage = STAGE_ORDER[idx+1];
  }

function undoStage(id){
  const p = state.business.pipeline.find(function(x){ return x.id===id; }); if(!p) return;
  if(!Array.isArray(p.stageHistory) || !p.stageHistory.length) return;
  const wasClosed = p.stage==='closed';
  p.stage = p.stageHistory.pop();
  if(wasClosed && p.stage!=='closed' && p.convertedClientId){
    const c = state.business.clients.find(function(x){ return x.id===p.convertedClientId; });
    if(c && !arr(c.deliverables).length && Number(c.mrr)===Number(p.value||0)){
      state.business.clients = state.business.clients.filter(function(x){ return x.id!==c.id; });
    }
    p.convertedClientId = null;
  }
  playTick();
  persist('business'); renderView();
}
function markLost(id){
  const p=state.business.pipeline.find(function(x){return x.id===id;}); if(!p) return;
  if(!Array.isArray(p.stageHistory)) p.stageHistory=[];

// ============ CRM: LEADS → CLIENTS LIFECYCLE ============
// One contact model across two lists: leads live in business.pipeline and clients in
// business.clients (existing records and every id that tasks, invoices, events and
// packages point at stay exactly as they were). Both share the same contact layer:
// editable stages, touchpoints with a cadence ("next touch due"), files, and a timeline.
// "Won" converts a lead into a client and carries all of that history across.
const TOUCH_TYPES = [
  {id:'call', icon:'&#128222;', label:'Call'},
  {id:'text', icon:'&#128172;', label:'Text'},
  {id:'dm', icon:'&#128241;', label:'DM'},
  {id:'email', icon:'&#9993;&#65039;', label:'Email'},
  {id:'meeting', icon:'&#129309;', label:'Meeting'},
  {id:'inperson', icon:'&#128694;', label:'In person'}
];
function touchTypeById(id){ return TOUCH_TYPES.find(function(t){ return t.id===id; }) || {id:'other', icon:'&#8226;', label:'Touch'}; }
function defaultCrm(){
  return {
    leadStages:[
      {id:'lead', label:'New', color:'#8A90A2'},
      {id:'contacted', label:'Contacted', color:'#8fdcff'},
      {id:'discovery', label:'Call booked', color:'#E8A23D'},
      {id:'proposal', label:'Proposal sent', color:'#f3c988'},
      {id:'closed', label:'Won', color:'#3FBE8E', kind:'won'},
      {id:'lost', label:'Lost', color:'#E8636B', kind:'lost'}
    ],
    clientStages:[
      {id:'onboarding', label:'Onboarding', color:'#8fdcff', active:true},
      {id:'active', label:'Active', color:'#3FBE8E', active:true},
      {id:'atrisk', label:'At risk', color:'#E8A23D', active:true},
      {id:'paused', label:'Paused', color:'#8A90A2', active:false},
      {id:'churned', label:'Churned', color:'#E8636B', active:false, kind:'churned'}
    ],
    leadCadenceDays:2, clientCadenceDays:7,
    dailyReminder:{enabled:false, time:'09:00'},
    lastTouchType:'text'
  };
}
let crmMigratedOnLoad = false;
// Called at the end of normalizeBusiness: fills in the CRM layer without changing anything
// that was already there.
function normalizeCrmData(b){
  const d = defaultCrm();
  if(!b.crm || typeof b.crm!=='object') b.crm = d;
  ['leadStages','clientStages'].forEach(function(k){ if(!Array.isArray(b.crm[k]) || !b.crm[k].length) b.crm[k] = d[k]; });
  ['leadCadenceDays','clientCadenceDays','lastTouchType'].forEach(function(k){ if(b.crm[k]==null) b.crm[k] = d[k]; });
  if(!b.crm.dailyReminder || typeof b.crm.dailyReminder!=='object') b.crm.dailyReminder = d.dailyReminder;
  const leadIds = b.crm.leadStages.map(function(s){ return s.id; });
  const clientIds = b.crm.clientStages.map(function(s){ return s.id; });
  const common = function(x){
    if(!Array.isArray(x.timeline)) x.timeline = [];
    if(!Array.isArray(x.files)) x.files = [];
    if(x.cadenceDays===undefined) x.cadenceDays = null;
  };
  b.pipeline.forEach(function(p){
    common(p);
    if(!Array.isArray(p.touchpoints)){ p.touchpoints = []; crmMigratedOnLoad = true; }
    if(leadIds.indexOf(p.stage)<0) p.stage = leadIds[0];
  });
  b.clients.forEach(function(c){
    common(c);
    if(!c.stage){ c.stage = c.status==='paused' ? 'paused' : 'active'; crmMigratedOnLoad = true; }
    if(clientIds.indexOf(c.stage)<0) c.stage = 'active';
    if(!Array.isArray(c.touchpoints)){
      // existing "touches" (dates only) become touchpoints so history isn't lost
      c.touchpoints = arr(c.touches).map(function(dt, i){ return {id:'tp'+c.id+'-'+i, type:'other', date:dt, note:''}; });
      crmMigratedOnLoad = true;
    }
    syncClientStatus(c, b);
  });
}
function crm(){ return state.business.crm; }
function crmStages(kind){ return kind==='lead' ? crm().leadStages : crm().clientStages; }
function crmStage(kind, id){ return crmStages(kind).find(function(s){ return s.id===id; }) || null; }
function crmList(kind){ return kind==='lead' ? state.business.pipeline : state.business.clients; }
function crmFind(kind, id){ return crmList(kind).find(function(x){ return x.id===id; }) || null; }
function crmName(kind, x){ return kind==='lead' ? (x.company||x.name||'Lead') : (x.business||x.name||'Client'); }
function crmSubName(kind, x){ const main = crmName(kind,x); const n = x.name||''; return n && n!==main ? n : ''; }
function clientStageActive(stageId, b){
  const stages = (b||state.business).crm ? (b||state.business).crm.clientStages : defaultCrm().clientStages;
  const st = stages.find(function(s){ return s.id===stageId; });
  return st ? st.active!==false : true;
}
function syncClientStatus(c, b){ c.status = clientStageActive(c.stage, b) ? 'active' : 'paused'; }
function leadIsOpen(p){ const st = crmStage('lead', p.stage); return !(st && (st.kind==='won' || st.kind==='lost')) && !p.convertedClientId; }
function crmTracked(kind, x){ return kind==='lead' ? leadIsOpen(x) : clientStageActive(x.stage); }
function crmCadence(kind, x){ return Number(x.cadenceDays) || (kind==='lead' ? crm().leadCadenceDays : crm().clientCadenceDays) || 7; }
function crmLastTouch(kind, x){
  const dates = arr(x.touchpoints).map(function(t){ return t.date; });
  if(kind==='client') arr(x.touches).forEach(function(d){ dates.push(d); });
  if(!dates.length) return null;
  return dates.sort()[dates.length-1];
}
function crmNextDue(kind, x){
  const base = crmLastTouch(kind, x) || x.createdAt || todayStr();
  return addDays(base, crmCadence(kind, x));
}
function crmOverdueDays(kind, x){ return crmTracked(kind, x) ? daysAgoFrom(crmNextDue(kind, x)) : null; }
function overdueLevel(n){ if(n==null || n<0) return ''; if(n===0) return 'due-0'; if(n<=2) return 'due-1'; if(n<=6) return 'due-2'; return 'due-3'; }
function dueLabel(n, kind, x){
  if(n==null) return '';
  if(n<0) return 'touch in '+(-n)+'d';
  if(n===0) return 'touch due today';
  return n+'d overdue';
}
function crmTimeline(x, type, text){
  if(!Array.isArray(x.timeline)) x.timeline = [];
  x.timeline.push({id:uid(), ts:Date.now(), type:type, text:text});
}
// ---- touchpoints ----
let lastTouchLogged = null;
function logTouch(kind, id, type, date, note){
  const x = crmFind(kind, id); if(!x) return;
  type = type || x.lastTouchType || crm().lastTouchType || 'text';
  date = date || todayStr();
  const tp = {id:uid(), type:type, date:date, note:note||'', ts:Date.now()};
  if(!Array.isArray(x.touchpoints)) x.touchpoints = [];
  x.touchpoints.push(tp);
  if(kind==='client'){ if(!Array.isArray(x.touches)) x.touches=[]; x.touches.push(date); }
  x.lastTouchType = type;
  crm().lastTouchType = type;
  lastTouchLogged = {kind:kind, id:id, tpId:tp.id, date:date};
  playPositive();
  persist('business'); renderView();
  const tt = touchTypeById(type);
  showToast('Logged a '+tt.label.toLowerCase()+' with '+crmName(kind,x), {icon:tt.icon, actionLabel:'Undo', actionAction:'undoLastTouch', duration:5000});
}
ACTIONS.undoLastTouch = function(){
  const l = lastTouchLogged; if(!l) return;
  const x = crmFind(l.kind, l.id); if(!x) return;
  x.touchpoints = arr(x.touchpoints).filter(function(t){ return t.id!==l.tpId; });
  if(l.kind==='client'){ const i = arr(x.touches).lastIndexOf(l.date); if(i>=0) x.touches.splice(i,1); }
  lastTouchLogged = null;
  const c = document.getElementById('toastContainer'); if(c) c.innerHTML='';
  persist('business'); renderView();
};

// ---- stages ----
function setStage(kind, id, stageId, opts){
  const x = crmFind(kind, id); if(!x || x.stage===stageId) return;
  const st = crmStage(kind, stageId); if(!st) return;
  if(kind==='lead' && st.kind==='lost' && !(opts && opts.reasonGiven)){ openLostReason(id); return; }
  const from = crmStage(kind, x.stage);
  if(kind==='lead'){ if(!Array.isArray(x.stageHistory)) x.stageHistory=[]; x.stageHistory.push(x.stage); }
  x.stage = stageId;
  crmTimeline(x, 'stage', (from?from.label:'—')+' → '+st.label);
  if(kind==='client') syncClientStatus(x);
  let newClientId = null;
  if(kind==='lead' && st.kind==='won' && !x.convertedClientId){ newClientId = convertProspectToClient(x); playSessionComplete(); }
  else playTick();
  persist('business');
  if(newClientId){
    showToast(crmName('lead',x)+' is now a client', {icon:'&#127881;', actionLabel:'Open', actionAction:'openConvertedClient', duration:6000});
    ui.lastConvertedClientId = newClientId;
  }
  renderView(); rerenderContactModal();
}

  if(t.dataset.crmCadence){ const p = t.dataset.crmCadence.split(':'); const x = crmFind(p[0], p[1]); if(x){ x.cadenceDays = Number(t.value)||null; persist('business'); renderView(); rerenderContactModal(); } }
  if(t.dataset.fileRename){ const p = t.dataset.fileRename.split(':'); const x = crmFind(p[0], p[1]); const f = x && arr(x.files).find(function(ff){ return ff.id===p[2]; }); if(f && t.value.trim()){ f.name = t.value.trim(); persist('business'); } }
});

// ---- drag between stages ----
document.addEventListener('dragstart', function(e){
  const card = e.target.closest && e.target.closest('[data-crm-drag]');
  if(!card) return;
  e.dataTransfer.setData('text/x-crm', card.dataset.crmDrag);
  e.dataTransfer.effectAllowed = 'move';
  card.classList.add('is-dragging');
});
document.addEventListener('dragend', function(e){
  const card = e.target.closest && e.target.closest('[data-crm-drag]');
  if(card) card.classList.remove('is-dragging');
  document.querySelectorAll('.crm-col.drop-over').forEach(function(c){ c.classList.remove('drop-over'); });
});
document.addEventListener('dragover', function(e){
  const col = e.target.closest && e.target.closest('[data-crm-drop]');
  if(!col || !e.dataTransfer || Array.prototype.indexOf.call(e.dataTransfer.types,'text/x-crm')<0) return;
  e.preventDefault();
  document.querySelectorAll('.crm-col.drop-over').forEach(function(c){ if(c!==col) c.classList.remove('drop-over'); });

function crmUi(kind){

function crmFiltered(kind){
  const f = crmUi(kind);
  const q = (f.q||'').trim().toLowerCase();
  let list = crmList(kind).filter(function(x){
    if(q){
      const hay = [x.name, x.company, x.business, x.phone, x.email, x.trade, x.notes].join(' ').toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    if(f.stage && x.stage!==f.stage) return false;
    if(f.source && (x.leadSource||'')!==f.source) return false;
    if(f.last){
      const lt = crmLastTouch(kind, x);
      if(f.last==='never'){ if(lt) return false; }
      else if(f.last==='due'){ const n = crmOverdueDays(kind,x); if(n==null || n<0) return false; }
      else { const days = Number(f.last); if(lt && daysAgoFrom(lt) < days) return false; }
    }
    return true;
  });
  const val = function(x){ return Number(kind==='lead' ? x.value : x.mrr)||0; };
  const sorts = {
    due: function(a,b){ const da = crmOverdueDays(kind,a), db = crmOverdueDays(kind,b); return (db==null?-9999:db)-(da==null?-9999:da); },
    last: function(a,b){ return (crmLastTouch(kind,a)||'').localeCompare(crmLastTouch(kind,b)||''); },
    value: function(a,b){ return val(b)-val(a); },
    name: function(a,b){ return crmName(kind,a).localeCompare(crmName(kind,b)); },
    created: function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); }
  };
  return list.slice().sort(sorts[f.sort]||sorts.due);
}

// One-off alarms derived from an event: get ready, leave (time − travel), remind-before.
function upsertEventAlarm(ev, kind, dateStr, hm, label){
  ev.extraAlarmIds = ev.extraAlarmIds || {};
  const existingId = ev.extraAlarmIds[kind];
  if(!dateStr || !hm){
    if(existingId){ state.focus.alarms = state.focus.alarms.filter(function(a){ return a.id!==existingId; }); delete ev.extraAlarmIds[kind]; }
    return;
  }
  let a = existingId ? state.focus.alarms.find(function(x){ return x.id===existingId; }) : null;
  if(!a){ a = {id:uid(), days:[], enabled:true}; state.focus.alarms.push(a); ev.extraAlarmIds[kind] = a.id; }
  a.time = hm; a.date = dateStr; a.label = label; a.eventId = ev.id; a.kind = kind; a.enabled = true;
}
function eventStartTs(ev){ return ev.time ? localTs(ev.date, ev.time) : null; }
function syncEventExtraAlarms(ev){
  const start = eventStartTs(ev);
  const at = function(ts){ const d = new Date(ts); return [todayStr(d), nowHM(d)]; };
  if(ev.isShoot && ev.readyTime) upsertEventAlarm(ev, 'ready', ev.date, ev.readyTime, 'Start getting ready — '+ev.title);
  else upsertEventAlarm(ev, 'ready', null);
  if(ev.isShoot && start && ev.travelMinutes>0){ const x = at(start-ev.travelMinutes*60000); upsertEventAlarm(ev, 'leave', x[0], x[1], 'Time to leave — '+ev.title+(ev.location?' ('+ev.location+')':'')); }
  else upsertEventAlarm(ev, 'leave', null);
  if(start && ev.remindBefore>0){ const y = at(start-ev.remindBefore*60000); upsertEventAlarm(ev, 'remind', y[0], y[1], ev.title+' in '+fmtDurationLabel(ev.remindBefore)); }
  else upsertEventAlarm(ev, 'remind', null);
}

// ---- Next alarm ----
function nextAlarmOccurrence(){
  const now = Date.now(); let best = null;
  arr(state.focus.alarms).forEach(function(a){
    if(!a.enabled || !a.time) return;
    for(let i=0;i<8;i++){
      const d = addDays(todayStr(), i);
      if(a.date){ if(a.date!==d) continue; }
      else { const dow = new Date(localTs(d,'12:00')).getDay(); if(arr(a.days).indexOf(dow)<0) continue; }
      const ts = localTs(d, a.time);
      if(ts<=now) continue;
      if(!best || ts<best.ts) best = {alarm:a, ts:ts, date:d};
      break;
    }
  });
  return best;
}

ACTIONS.saveNightPlan = function(){
  readNightPlanForm();
  const d = ui.nightPlanDraft; if(!d) return;
  const prev = state.focus.nightPlan;
  let alarmId = prev && prev.date===d.date ? prev.alarmId : null;
  if(d.alarmTime){
    let a = alarmId ? state.focus.alarms.find(function(x){ return x.id===alarmId; }) : null;
    if(!a){ a = {id:uid(), days:[], enabled:true}; state.focus.alarms.push(a); alarmId = a.id; }
    a.time = d.alarmTime; a.date = d.date; a.label = 'Wake up'; a.wake = true; a.kind = 'wake'; a.enabled = true;
    a.wakeNote = d.note||''; a.mediaUrl = d.mediaUrl||'';
  } else if(alarmId){
    state.focus.alarms = state.focus.alarms.filter(function(x){ return x.id!==alarmId; }); alarmId = null;

async function exportData(){
  // Images and files live in IndexedDB; bundle them into the export so it's complete.
  const out = JSON.parse(JSON.stringify(state));
  const refs = Array.from(collectBlobRefs(state));
  if(refs.length){
    out.__blobs = {};
    for(const ref of refs){
      const b = await blobFetch(ref);
      if(b){ try{ out.__blobs[ref] = await readAsDataUrl(b); }catch(e){} }
    }
  }
  const data = JSON.stringify(out, null, 2);
  try{
    const blob = new Blob([data], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'operator-data.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(e){}
  const area = document.getElementById('exportArea');
  if(area){ area.style.display='block'; area.value = data.length > 400000 ? data.slice(0,400000)+'\n… (truncated here — the downloaded file is complete)' : data; }
}

async function importDataFile(file){
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    if(parsed.__blobs && typeof parsed.__blobs==='object'){
      for(const ref of Object.keys(parsed.__blobs)){
        if(!isBlobRef(ref)) continue;
        try{ await blobStore(dataUrlToBlob(parsed.__blobs[ref]), ref.slice(4)); }catch(e){}
      }
    }
    STATE_KEYS.forEach(function(k){ if(parsed[k]!=null) state[k]=parsed[k]; });
    normalizeAll();
    applyTheme();
    for(const k of STATE_KEYS) await persist(k);
    renderView();
  }catch(e){ inlineNotice('Could not read that file.'); }
}

let lastRenderedView = null;
let lastRenderedDay = null;
function renderView(){
  if(ui.currentTaskId && (!state.focus.activeSession || state.focus.activeSession.onBreak)){ accumulateCurrentTaskTime(ui.currentTaskId); persist('tasks'); }
  const root = document.getElementById('viewRoot');
  let html = '';
  switch(ui.view){
    case 'today': html = renderToday(); break;
    case 'focus': html = renderFocus(); break;
    case 'calendar': html = renderCalendar(); break;
    case 'personal': html = renderPersonal(); break;
    case 'business': html = renderBusiness(); break;
    case 'settings': html = renderSettings(); break;
    default: html = renderToday();
  }
  if(lastRenderedView !== ui.view){
    // Navigating to another view: fresh content, scrolled to the top, with a soft fade.
    root.innerHTML = html;
    const main = root.closest('.main');
    if(main) main.scrollTop = 0;
    root.classList.remove('view-fade'); void root.offsetWidth; root.classList.add('view-fade');
    lastRenderedView = ui.view;
  } else {
    // Same view: patch in place so nothing that didn't change is touched (no flash,
    // no scroll jumps, no replayed entry animations).
    morphInto(root, html);
  }
  lastRenderedDay = todayStr();
  updateNavActive();
  document.querySelectorAll('.scroll-picker').forEach(function(pk){ initScrollPicker(pk.id, Number(pk.dataset.selected)); });
  const modalOverlay = document.getElementById('preFocusOverlay');
  if(modalOverlay && !modalOverlay.classList.contains('hidden')) renderPreFocusModalInto();
  const stopOverlay = document.getElementById('stopFocusOverlay');
  if(stopOverlay && !stopOverlay.classList.contains('hidden')) renderStopFocusModalInto();
  const timesUpOverlay = document.getElementById('timesUpOverlay');
  if(timesUpOverlay && !timesUpOverlay.classList.contains('hidden')) renderTimesUpModalInto();
  const taskEditOverlay = document.getElementById('taskEditOverlay');
  if(taskEditOverlay && !taskEditOverlay.classList.contains('hidden')) renderTaskEditModalInto();
  const prospectEditOverlay = document.getElementById('prospectEditOverlay');

function stretchLockedHeaderLine(){
  const header = document.querySelector('.locked-in-header');
  const main = document.querySelector('.main');
  if(!header || !main) return;
  const mainRect = main.getBoundingClientRect();
  const headerRect = header.getBoundingClientRect();
  const leftGap = Math.max(0, headerRect.left - mainRect.left);
  const rightGap = Math.max(0, mainRect.right - headerRect.right);
  header.style.marginLeft = (-leftGap)+'px';
  header.style.marginRight = (-rightGap)+'px';
  header.style.paddingLeft = (leftGap+16)+'px';
  header.style.paddingRight = (rightGap+16)+'px';
  // Pull the header up over .main's top padding — that padding used to leave an empty
  // black band above the locked-in header.
  const padTop = parseFloat(getComputedStyle(main).paddingTop)||0;
  header.style.marginTop = (-padTop)+'px';
}
window.addEventListener('resize', stretchLockedHeaderLine);

// Midnight rollover. Previously nothing re-rendered at 12 AM unless a session was running,
// so on a non-working day the app stayed on yesterday until you clicked something.
function handleDayRollover(prevDay){
  splitActiveModeAtMidnight();
  if(ui.calendarSelectedDate===prevDay){
    ui.calendarSelectedDate = todayStr();
    ui.calendarYear = new Date().getFullYear();
    ui.calendarMonth = new Date().getMonth();
  }
  renderView();
}
// An off-time / shooting block that runs past midnight is logged per day: the part before
// midnight is saved to the day it belongs to and the block carries on from 12 AM. Break
// mode is tied to the focus session, so it's left alone.
function splitActiveModeAtMidnight(){
  const active = state.modes.active;
  if(!active || active.linkedFocus) return;
  let changed = false;
  while(todayStr(new Date(active.startedAt)) < todayStr()){
    const start = new Date(active.startedAt);
    const midnight = new Date(start.getFullYear(), start.getMonth(), start.getDate()+1).getTime();
    const minutes = Math.max(1, Math.round((midnight-active.startedAt)/60000));
    state.modes.history.push({id:uid(), type:active.type, date:todayStr(start), startedAt:active.startedAt, endedAt:midnight, minutes:minutes, note:active.note||'', sleep:!!active.sleep, splitAtMidnight:true});
    active.startedAt = midnight;
    changed = true;
  }
  if(changed) persist('modes');
}

function startFocusTicker(){
  setInterval(function(){
    const as0 = state.focus.activeSession;
    if(ui.currentTaskId && ui.currentTaskStartedAt && (!as0 || !as0.onBreak)){
      const ctEl = document.getElementById('currentTaskElapsed');
      if(ctEl) ctEl.textContent = formatElapsed(Date.now()-ui.currentTaskStartedAt);

    }
    const as = state.focus.activeSession;

    if(!as) return;

      return;
    }
    const el = document.getElementById('focusElapsed');
    if(el){
      const ms = Date.now() - as.startedAt;
      el.textContent = formatElapsed(ms);
    }
    if(as.plannedMinutes){
      const ms = Date.now() - as.startedAt;
      const pct = clamp(Math.round((ms/60000/as.plannedMinutes)*100),0,100);
      const bar = document.getElementById('focusProgressBar');
      if(bar) bar.style.width = pct+'%';

        as.completeFired = true;
        playSessionComplete();
        const card = document.getElementById('focusHeroCard');
        if(card) card.classList.add('focus-complete-pulse');

        persist('focus');
      }
    } else {
      const bar = document.getElementById('focusProgressBar');
      if(bar){
        const dwTarget = state.standards.deepWorkTargetMinutes || 180;
        const liveToday = deepWorkMinutesTodayLive();
        const openPct = clamp(Math.round((liveToday/dwTarget)*100),0,100);
        bar.style.width = openPct+'%';

    }
  }, 1000);
}
let firedKeys = new Set();
let lastMinute = '';
let ringInterval = null;
function startAlarmChecker(){
  setInterval(function(){
    checkReminders();
    checkTouchReminder();
    const now = new Date();
    const hm = nowHM(now);
    const dateKey = todayStr(now);
    const minuteKey = dateKey+'T'+hm;
    if(minuteKey!==lastMinute){ firedKeys.clear(); lastMinute=minuteKey; }
    (state.focus.alarms||[]).forEach(function(al){
      if(!al.enabled) return;
      if(al.time!==hm) return;
      if(al.date){ if(al.date!==dateKey) return; } else { if(al.days.indexOf(now.getDay())<0) return; }
      const fk = al.id+minuteKey;
      if(firedKeys.has(fk)) return;
      firedKeys.add(fk);
      triggerAlarm(al);
      if(al.date){
        state.focus.alarms = state.focus.alarms.filter(function(x){ return x.id!==al.id; });
        persist('focus'); renderView();
      }
    });
  }, 4000);
}
let lastFiredAlarm = null;
function triggerAlarm(al){
  lastFiredAlarm = al;
  document.getElementById('alarmLabel').textContent = (al && al.label) || 'Reminder';
  const extra = document.getElementById('alarmExtra');
  if(extra) extra.innerHTML = renderAlarmExtra(al);
  onEventAlarm(al);
  document.getElementById('alarmOverlay').classList.remove('hidden');
  playBeep();
  clearInterval(ringInterval);
  ringInterval = setInterval(playBeep, 2400);
  try{
    if('Notification' in window && Notification.permission==='granted'){
      new Notification('Operator: ' + ((al && al.label) || 'Reminder'));
    }
  }catch(e){}
}
function dismissAlarm(){ clearInterval(ringInterval); document.getElementById('alarmOverlay').classList.add('hidden'); }
function snoozeAlarm(){ const al = lastFiredAlarm; dismissAlarm(); setTimeout(function(){ triggerAlarm(Object.assign({}, al||{}, {label:((al&&al.label)||'Reminder')+' (snoozed)', eventId:null})); }, 5*60*1000); }

document.body.addEventListener('keydown', function(e){
  if(e.key!=='Enter') return;
  const id = e.target && e.target.id;
  if(id==='newVideoIdeaTitle'){ e.preventDefault(); addVideoIdea(); }
  if(id==='newTaskCatLabel'){ e.preventDefault(); addTaskCategory(); }
  if(id==='newVideoTypeLabel'){ e.preventDefault(); addVideoType(); }
  if(id==='miniReminderLabel'){ e.preventDefault(); addMiniReminder(); }
  if(id==='backlogSearchInput'){ e.preventDefault(); }
});
document.body.addEventListener('change', function(e){
  if(e.target && e.target.id==='importFile' && e.target.files[0]){
    importDataFile(e.target.files[0]);
  }
  if(e.target && e.target.id==='journalPhotoInput' && e.target.files && e.target.files.length){
    handleJournalPhotoFiles(e.target.files);
    e.target.value = '';
  }
  if(e.target && e.target.dataset){
    if(e.target.dataset.calCatLabel){ renameCalCategory(e.target.dataset.calCatLabel, e.target.value); }
    if(e.target.dataset.taskCatLabel){ renameTaskCategory(e.target.dataset.taskCatLabel, e.target.value); }

    if(e.target.dataset.videoTypeLabel){ renameVideoType(e.target.dataset.videoTypeLabel, e.target.value); }
    if(e.target.dataset.calCatAutoremind){
      const cat = categoryById(e.target.dataset.calCatAutoremind);
      if(cat){ cat.autoRemind = e.target.checked; persist('calendar'); }
    }
    if(e.target.dataset.journalTypeLabel){ renameJournalType(e.target.dataset.journalTypeLabel, e.target.value); }
    if(e.target.dataset.journalTypeEmoji){ renameJournalTypeEmoji(e.target.dataset.journalTypeEmoji, e.target.value); }
  }
  if(e.target && e.target.id==='calEventIsShoot'){

    if(ex) ex.style.display = e.target.checked ? 'block' : 'none';
  }
  if(e.target && e.target.id==='newTaskOngoing'){
    const extra = document.getElementById('newTaskOngoingExtra');
    if(extra) extra.style.display = e.target.checked ? 'block' : 'none';
  }
  if(e.target && e.target.id && e.target.id.indexOf('editOngoing-')===0){
    const taskId = e.target.id.slice('editOngoing-'.length);
    const extra = document.getElementById('editTaskOngoingExtra-'+taskId);
    if(extra) extra.style.display = e.target.checked ? 'block' : 'none';
  }
  if(e.target && e.target.id==='journalTabClientSelect'){
    ui.journalTabClientId = e.target.value;
  }
});
document.body.addEventListener('click', function(e){
  const link = e.target.closest && e.target.closest('.quick-link-item[href]');
  if(!link || link.dataset.action==='aiButtonPress') return;
  if(!state.focus.activeSession){ e.preventDefault(); maybeNudgeLockIn(); }
}, true);
function updateAiButtonPreview(tool){
  const btn = document.querySelector('[data-action="aiButtonPress"]');
  if(!btn) return;
  const circle = btn.querySelector('.quick-link-circle');
  if(circle) circle.innerHTML = quickLinkIconInnerHtml(tool.id, tool.emoji, tool.bg);
  btn.setAttribute('href', safariizeUrl(tool.url));
  btn.title = 'Click to open '+tool.label+'. Hold to switch AI.';
}
document.body.addEventListener('mousedown', function(e){
  const btn = e.target.closest && e.target.closest('[data-action="aiButtonPress"]');
  if(!btn) return;
  aiHoldCycled = false;
  const q = quickLinksSettings();
  aiPreviewToolId = q.lastAiUsed;
  if(aiHoldTimer) clearTimeout(aiHoldTimer);
  if(aiHoldInterval) clearInterval(aiHoldInterval);
  aiHoldTimer = setTimeout(function(){
    aiHoldInterval = setInterval(function(){
      aiHoldCycled = true;
      const idx = AI_TOOLS.findIndex(function(t){ return t.id===aiPreviewToolId; });
      const next = AI_TOOLS[(idx+1)%AI_TOOLS.length];
      aiPreviewToolId = next.id;
      updateAiButtonPreview(next);
      playTick();
    }, 480);
  }, 350);
});
document.body.addEventListener('mouseup', function(){
  if(aiHoldTimer){ clearTimeout(aiHoldTimer); aiHoldTimer = null; }
  if(aiHoldInterval){ clearInterval(aiHoldInterval); aiHoldInterval = null; }
  if(aiHoldCycled && aiPreviewToolId){
    const q = quickLinksSettings();
    q.lastAiUsed = aiPreviewToolId;
    persist('settings');
    // defer the full re-render until after the click event (which fires right
    // after mouseup) has been handled — replacing the DOM synchronously here
    // can suppress that click, leaving the tool open unintentionally.
    setTimeout(function(){ renderView(); }, 0);
  }
});
document.body.addEventListener('dragstart', function(e){
  const card = e.target.closest && e.target.closest('[draggable="true"][data-task-id]');
  if(!card) return;
  e.dataTransfer.setData('text/plain', card.dataset.taskId);
  e.dataTransfer.effectAllowed = 'move';
});
document.body.addEventListener('dragover', function(e){
  const zone = e.target.closest && e.target.closest('[data-dropzone]');
  if(!zone) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
});
document.body.addEventListener('dragenter', function(e){
  const zone = e.target.closest && e.target.closest('[data-dropzone]');
  if(zone) zone.classList.add('drop-hover');
});
document.body.addEventListener('dragleave', function(e){
  const zone = e.target.closest && e.target.closest('[data-dropzone]');
  if(zone && !zone.contains(e.relatedTarget)) zone.classList.remove('drop-hover');
});
document.body.addEventListener('drop', function(e){
  const zone = e.target.closest && e.target.closest('[data-dropzone]');
  if(!zone) return;
  e.preventDefault();
  zone.classList.remove('drop-hover');
  const taskId = e.dataTransfer.getData('text/plain');
  const newZone = zone.dataset.dropzone;
  const t = state.tasks.items.find(function(x){ return x.id===taskId; });
  if(!t) return;
  if(newZone==='current'){ if(state.focus.activeSession){ setCurrentTask(taskId); } else { stageNextTask(taskId); } return; }
  if(t.status===newZone) return;
  if(newZone==='done'){
    completeTask(taskId);
  } else if(t.status==='done'){
    undoTask(taskId);
    const t2 = state.tasks.items.find(function(x){ return x.id===taskId; });
    if(t2){ t2.status = newZone; persist('tasks'); renderView(); }
  } else {
    t.status = newZone;
    persist('tasks'); renderView();
  }
});
document.body.addEventListener('input', function(e){
  if(e.target && (e.target.id==='quickJournalText' || e.target.id==='journalPageText' || e.target.id==='quickJournalModalText')){
    ui.journalDraftText = e.target.value;
  }
  if(e.target && e.target.id==='newClientJournalText'){
    ui.newClientJournalDraft = e.target.value;
  }
  if(e.target && e.target.id==='journalTabClientText'){
    ui.journalTabClientDraft = e.target.value;
  }
  if(e.target && e.target.id==='journalSearchInput'){
    ui.journalSearchText = e.target.value;
    updateJournalHistoryDisplay();
  }
  if(e.target && e.target.id==='clientJournalSearchInput'){
    ui.clientJournalSearchText = e.target.value;
    updateClientJournalResultsDisplay();
  }
  if(e.target && e.target.id==='journalTabAllClientSearchInput'){
    ui.clientJournalSearchText = e.target.value;
    updateJournalTabAllClientResultsDisplay();
  }
  if(e.target && e.target.id==='journalClearInput'){
    updateJournalClearText(e.target.value);
  }
  if(e.target && e.target.id==='backlogSearchInput'){
    ui.backlogSearchText = e.target.value;
    refreshBacklogResults();
  }
  if(e.target && e.target.id==='preFocusPickSearchInput'){
    ui.preFocusPickSearch = e.target.value;
    updatePreFocusPickResults();
  }
  if(e.target && e.target.id==='clientDeleteConfirmInput'){
    const btn = document.getElementById('clientDeleteConfirmBtn');
    if(btn){
      const expected = (e.target.dataset.clientName||'').trim().toLowerCase();
      btn.disabled = e.target.value.trim().toLowerCase() !== expected;
    }
  }
});
document.body.addEventListener('change', function(e){
  const el = e.target;
  if(el && el.id==='setCrosshair'){
    state.profile.crosshairCursor = el.checked;
    persist('profile'); applyCursorSetting();
  }
  if(el && el.id==='setBigClock'){
    state.profile.bigClockOnToday = el.checked;
    persist('profile'); renderView();
  }
  if(el && el.id==='clientJournalClientFilterSelect'){
    ui.clientJournalFilterClientId = el.value || null;
    updateClientJournalResultsDisplay();
  }
  if(el && el.id==='journalTabAllClientFilterSelect'){
    ui.clientJournalFilterClientId = el.value || null;
    updateJournalTabAllClientResultsDisplay();
  }
  if(el && el.dataset && el.dataset.actionInput==='packageDeliverableTarget'){
    const pk = arr(state.business.packages).find(function(x){return x.id===el.dataset.id;});
    if(pk){
      const d = arr(pk.deliverables).find(function(x){return x.id===el.dataset.did;});
      if(d){
        d.weeklyTarget = Math.max(1, Number(el.value)||1);
        // Keep already-assigned clients' copies of this deliverable in sync — otherwise
        // their counters keep showing the stale target from whenever they were assigned.
        arr(state.business.clients).forEach(function(c){
          arr(c.deliverables).forEach(function(cd){
            if(cd.fromPackage && cd.sourceId===d.id) cd.weeklyTarget = d.weeklyTarget;
          });
        });
        persist('business'); renderView();
      }
    }
  }
  if(el && el.dataset && el.dataset.iconUpload && el.files && el.files[0]){
    const key = el.dataset.iconUpload;
    const file = el.files[0];
    const reader = new FileReader();
    reader.onload = function(){
      if(!state.settings.quickLinks.icons) state.settings.quickLinks.icons = {};
      state.settings.quickLinks.icons[key] = reader.result;
      persist('settings'); renderView();
    };
    reader.readAsDataURL(file);
  }
});

  state.profile = normalizeProfile(await loadKey('profile', defaultProfile()));
  state.tasks = normalizeTasks(await loadKey('tasks', {items:[]}));
  state.focus = normalizeFocus(await loadKey('focus', defaultFocus()));

  state.meals = normalizeMeals(await loadKey('meals', defaultMeals()));
  state.journal = normalizeJournal(await loadKey('journal', {entries:[]}));
  state.finances = normalizeFinances(await loadKey('finances', {debts:[], payments:[], income:[]}));
  state.business = normalizeBusiness(await loadKey('business', {pipeline:[], clients:[]}));
  state.calendar = normalizeCalendar(await loadKey('calendar', defaultCalendar()));
  state.standards = normalizeStandards(await loadKey('standards', defaultStandards()));
  state.daysOff = normalizeDaysOff(await loadKey('daysOff', defaultDaysOff()));
  state.goals = normalizeGoals(await loadKey('goals', defaultGoals()));
  state.dashboardPanels = normalizeDashboardPanels(await loadKey('dashboardPanels', defaultDashboardPanels()));
  state.modes = normalizeModes(await loadKey('modes', defaultModes()));
  state.settings = normalizeSettings(await loadKey('settings', defaultSettings()));
  state.appActivity = normalizeAppActivity(await loadKey('appActivity', defaultAppActivity()));
  state.personal = normalizePersonal(await loadKey('personal', defaultPersonal()));
  state.boards = normalizeBoards(await loadKey('boards', defaultBoards()));

  splitActiveModeAtMidnight();
  if(crmMigratedOnLoad) persist('business');
  applyTheme();
  applySidebarState();
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='flex';
  renderView();
  startClocks();
  startFocusTicker();
  startModeTicker();
  startAlarmChecker();
  startAppActivityPolling();
}
init();

})();
